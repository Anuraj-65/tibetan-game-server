<head>

    <meta charset="UTF-8">

    <title>TibetanKeys | Calibration</title>
    <link rel="icon" type="image/png" href="og.png">

    <style>
        @font-face { font-family: 'OuChan2'; src: url('Monlam Uni OuChan2.ttf'); }

        :root { 
            --bg: #000000; 
            --accent: #d4af37; /* Gold */
            --text: #ffffff; 
            --blue-glow: #00ffff; /* Cyan */
            --success: #00e676; 
        }
        
        body, html { 
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text); 
            font-family: 'Segoe UI', sans-serif; 
            height: 100vh; width: 100vw; overflow: hidden; 
            display: flex; flex-direction: column; 
            user-select: none;
        }

        /* --- PRELOADER --- */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 20000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.8s ease-out;
        }

        .loader-dots { display: flex; gap: 12px; }
        .dot {
            width: 15px; height: 15px; background-color: var(--accent);
            border-radius: 50%; box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { animation-delay: 0s; }
        .dot:nth-child(4) { animation-delay: 0.16s; }
        .dot:nth-child(5) { animation-delay: 0.32s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 20px var(--accent); }
        }

        /* --- INTRO SCREEN --- */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none;
        }
        .intro-text {
            font-family: 'OuChan2', serif; font-size: 80px; font-weight: bold;
            background: linear-gradient(110deg, #8a6e03 10%, #ffd700 30%, #ffffff 50%, #ffd700 70%, #8a6e03 90%);
            background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text;
            letter-spacing: 5px; text-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
        }
        .animate-intro { animation: shine 2s linear infinite, controlledZoom 3.5s ease-out forwards; }
        @keyframes shine { to { background-position: 200% center; } }
        @keyframes controlledZoom {
            0% { transform: scale(0.1); opacity: 0; }
            30% { transform: scale(0.8); opacity: 1; }
            80% { transform: scale(0.9); opacity: 1; }
            100% { transform: scale(1.0); opacity: 0; }
        }

        /* --- HUD (UPDATED) --- */
        .hud { 
            width: 100%; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.1); background: rgba(0, 0, 0, 0.3); 
            height: 70px; flex-shrink: 0; z-index: 50; box-sizing: border-box;
            opacity: 0; transition: opacity 1s;
        }
        .level-info h1 { margin: 0; font-size: 14px; letter-spacing: 3px; color: #666; text-transform: uppercase; }
        
        /* New Instruction Styling in HUD */
        .hud-instruction {
            font-size: 20px; color: var(--accent); letter-spacing: 4px; 
            text-transform: uppercase; font-weight: 900; 
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            position: absolute; left: 50%; transform: translateX(-50%);
        }

        /* --- STAGE (UPDATED) --- */
        .stage { 
            flex: 1; display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
            width: 100%; position: relative; padding-top: 40px; /* More padding */
        }

        /* Target Container - BIGGER NOW */
        .target-container {
            display: flex; align-items: center; justify-content: center;
            height: 120px; /* Increased height */
            margin-bottom: 10px; width: 100%; position: relative; 
        }

        .target-text { 
            font-family: 'Segoe UI', sans-serif; 
            font-size: 80px; /* Bigger Text */
            font-weight: 900; letter-spacing: 20px; text-transform: uppercase; 
            position: absolute; opacity: 0; transition: opacity 0.3s;
        }
        .target-text.active { opacity: 1; }

        #embedded-countdown {
            font-family: 'Segoe UI', sans-serif; 
            font-size: 100px; /* Bigger Countdown */
            font-weight: 900;
            color: var(--success); text-shadow: 0 0 30px var(--success);
            display: none; z-index: 100;
        }

        .char { opacity: 0.2; transition: 0.1s; }
        .char.current { opacity: 1; color: var(--blue-glow); text-shadow: 0 0 30px var(--blue-glow); transform: scale(1.1); }
        .char.correct { opacity: 1; color: var(--text); text-shadow: 0 0 15px #fff; }
        .char.space { display: inline-block; width: 30px; }

        /* --- KEYBOARD --- */
        #keyboard-wrapper { 
            position: relative; width: 950px; height: 400px; max-width: 95%; margin: 0 auto;
            opacity: 0; transform: translateY(50px); transition: opacity 1s, transform 1s ease-out;
        }
        .keyboard-visible { opacity: 1 !important; transform: translateY(0) !important; }

        #layer-keyboard { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #layer-hands { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 1s; }
        .hands-visible { opacity: 1 !important; }

        .st2 { fill: transparent; }
        .st0 { fill: #d4af37; font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; pointer-events: none; }
        .st1 { fill: none; opacity: .6; stroke: #d4af37; stroke-width: 1.5px; transition: all 0.1s; }
        .bump { fill: #d4af37; opacity: 0.8; }

        .key-active {
            fill: var(--accent) !important; stroke: var(--accent) !important;
            fill-opacity: 0.3 !important; stroke-width: 3px !important;
            filter: drop-shadow(0 0 15px var(--accent));
        }

        #LH, #RH { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.3); stroke-width: 1px; }
        #LP, #LR, #LM, #LI, #T, #RI, #RM, #RR, #RP { fill: none; stroke: none; transition: stroke 0.1s, fill 0.1s; }

        /* --- SUPER FINGER GLOW --- */
        .finger-active {
            stroke: none !important; 
            fill: url(#finger-gradient) !important; 
            opacity: 1 !important;
            /* Double Shadow for intense neon effect */
            filter: drop-shadow(0 0 15px var(--blue-glow)) drop-shadow(0 0 25px var(--blue-glow));
        }

        /* --- MODAL --- */
        #result-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; 
            backdrop-filter: blur(5px);
        }
        .result-box { 
            border: 2px solid var(--success); padding: 60px; text-align: center; width: 500px; max-width: 90%; 
            background: linear-gradient(145deg, rgba(1, 20, 10, 0.95), rgba(0, 10, 5, 0.95)); 
            box-shadow: 0 0 60px rgba(0, 230, 118, 0.15), inset 0 0 20px rgba(0, 230, 118, 0.05); 
            border-radius: 40px; display: flex; flex-direction: column; align-items: center; gap: 40px;
        }
        .res-msg { font-size: 36px; color: #fff; letter-spacing: 4px; font-weight: 900; text-transform: uppercase; line-height: 1.2; text-shadow: 0 0 30px var(--success); }
        .res-btn { 
            background: var(--success); color: #000; border: none; padding: 20px 50px; font-size: 18px;
            font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; border-radius: 50px; 
            transition: all 0.3s ease; box-shadow: 0 0 15px rgba(0, 230, 118, 0.5);
        }
        .res-btn:hover { transform: scale(1.05); background: #fff; box-shadow: 0 0 40px #fff; }
        
        .prompt-txt { font-size: 12px; color: #888; margin-top: -20px; letter-spacing: 1px; text-transform: uppercase; }
        .prompt-txt span { color: #fff; font-weight: bold; border: 1px solid #555; padding: 2px 6px; border-radius: 4px; margin: 0 5px; }

        .back-btn { position: fixed; bottom: 15px; left: 40px; color: rgba(255,255,255,0.3); text-decoration: none; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; z-index: 50; }
    </style>
</head>

    <div id="result-modal">
        <div class="result-box">
            <div class="res-msg">CALIBRATION<br>COMPLETE</div>
            <button class="res-btn" onclick="window.location.href='lessons.html'">BEGIN ASCENT</button>
            <div class="prompt-txt">Press <span>SPACE</span> to Map | <span>ENTER</span> to Level 1</div>
        </div>
    </div>

    <a href="lessons.html" class="back-btn">← Abort</a>

    <script>
        const CALIBRATION_STRING = "asdf jkl;"; 
        let currentIndex = 0;
        let isGameActive = false;
        let countdownVal = 5;

        // Elements
        const preloader = document.getElementById('preloader');
        const introOverlay = document.getElementById('intro-overlay');
        const tibetanText = document.getElementById('tibetan-text');
        const keyboardWrapper = document.getElementById('keyboard-wrapper');
        const layerHands = document.getElementById('layer-hands');
        const hud = document.getElementById('main-hud');
        const display = document.getElementById('target-display');
        const embeddedCountdown = document.getElementById('embedded-countdown');

        // MAPPING
        const keyMap = {
            'a': { finger: 'LP', key: 'key-A' },
            's': { finger: 'LR', key: 'key-S' },
            'd': { finger: 'LM', key: 'key-D' },
            'f': { finger: 'LI', key: 'key-F' },
            'j': { finger: 'RI', key: 'key-J' },
            'k': { finger: 'RM', key: 'key-K' },
            'l': { finger: 'RR', key: 'key-L' },
            ';': { finger: 'RP', key: 'key-SEMI' },
            ' ': { finger: 'T', key: 'key-SPACE' }
        };

        // --- PRELOADER LOGIC ---
        window.addEventListener('load', () => {
            document.fonts.ready.then(() => {
                preloader.style.opacity = '0';
                setTimeout(() => {
                    preloader.style.display = 'none';
                    startSequence();
                }, 800);
            });
        });

        function startSequence() {
            introOverlay.style.opacity = '1';
            tibetanText.classList.add('animate-intro');
            
            setTimeout(() => {
                introOverlay.style.opacity = '0';
                keyboardWrapper.classList.add('keyboard-visible');
                hud.style.opacity = '1';
                
                setTimeout(() => {
                    layerHands.classList.add('hands-visible');
                    // Instruction is already in HUD, no need to fade in separately
                    setTimeout(startCountdown, 1000);
                }, 1000);
            }, 3500);
        }

        function startCountdown() {
            embeddedCountdown.style.display = 'block';
            let timer = setInterval(() => {
                countdownVal--;
                if(countdownVal > 0) {
                    embeddedCountdown.innerText = countdownVal;
                } else {
                    clearInterval(timer);
                    embeddedCountdown.style.display = 'none';
                    startActionPhase();
                }
            }, 1000);
        }

        function startActionPhase() {
            isGameActive = true;
            display.classList.add('active');
            
            document.getElementById('key-F').querySelector('rect').classList.add('anchor-glow');
            document.getElementById('key-J').querySelector('rect').classList.add('anchor-glow');
            
            renderString();
        }

        function renderString() {
            display.innerHTML = '';
            const chars = CALIBRATION_STRING.split('');
            chars.forEach((char, i) => {
                const span = document.createElement('span');
                span.innerText = char.toUpperCase();
                span.className = 'char' + (i === 0 ? ' current' : '');
                if(char === ' ') { 
                    span.innerHTML = "&nbsp;"; 
                    span.className += " space"; 
                }
                display.appendChild(span);
            });
            updateGuides();
        }

        function updateGuides() {
            document.querySelectorAll('.finger-active').forEach(d => d.classList.remove('finger-active'));
            document.querySelectorAll('.key-active').forEach(k => k.classList.remove('key-active'));
            document.querySelectorAll('.anchor-glow').forEach(el => el.classList.remove('anchor-glow'));

            if(currentIndex < CALIBRATION_STRING.length) {
                const nextChar = CALIBRATION_STRING[currentIndex].toLowerCase();
                const targetData = keyMap[nextChar];
                
                if(targetData) {
                    const fingerEl = document.getElementById(targetData.finger);
                    if(fingerEl) fingerEl.classList.add('finger-active');

                    const keyGroup = document.getElementById(targetData.key);
                    if(keyGroup) {
                        const rect = keyGroup.querySelector('rect');
                        if(rect) rect.classList.add('key-active');
                    }
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            // Check for Modal Shortcut (ENTER or SPACE) when game is over
            const modal = document.getElementById('result-modal');
            if (modal.style.display === 'flex') {
                if (e.key === 'Enter') {
                    // Go to Level 1
                    window.location.href = 'basic-room.html?level=1';
                } else if (e.code === 'Space') {
                    // Return to Map
                    window.location.href = 'lessons.html';
                }
                return;
            }

            if(!isGameActive) return; 
            if(e.key === "Shift" || e.key === "Tab") return;

            const spans = document.querySelectorAll('.char');
            if(currentIndex >= spans.length) return;

            const typed = e.key.toLowerCase();
            const target = CALIBRATION_STRING[currentIndex].toLowerCase();
            
            let isMatch = (typed === target);
            if(target === " " && e.code === "Space") isMatch = true;

            if(isMatch) {
                spans[currentIndex].className = 'char correct';
                currentIndex++;
                
                if(currentIndex < spans.length) {
                    spans[currentIndex].className = 'char current';
                    updateGuides();
                } else {
                    finishLevel();
                }
            } else {
                spans[currentIndex].classList.add('wrong'); 
            }
        });

        function finishLevel() {
            isGameActive = false;
            document.querySelectorAll('.finger-active').forEach(d => d.classList.remove('finger-active'));
            document.querySelectorAll('.key-active').forEach(k => k.classList.remove('key-active'));
            document.getElementById('result-modal').style.display = 'flex';
            localStorage.setItem('tk_lvl_0', 'true');
        }
    </script>
</body>
</html>
