        const YAK_GAME = `

<script>
const KEY_MAP = { 'k': 'ཀ', 'K': 'ཁ', 'g': 'ག', 'f': 'ང', 'c': 'ཅ', 'C': 'ཆ', 'j': 'ཇ', 'N': 'ཉ', 't': 'ཏ', 'T': 'ཐ', 'd': 'ད', 'n': 'ན', 'p': 'པ', 'P': 'ཕ', 'b': 'བ', 'm': 'མ', 'x': 'ཙ', 'X': 'ཚ', 'D': 'ཛ', 'w': 'ཝ', 'z': 'ཟ', 'Z': 'ཞ', '\\'': 'འ', 'y': 'ཡ', 'r': 'ར', 'l': 'ལ', 'S': 'ཤ', 's': 'ས', 'h': 'ཧ', 'A': 'ཨ' };
const CHAR_POOL = ${CHARS};
const POWERS = { NONE: 0, LEVITATE: 1, DOUBLE: 2, SPEED: 3, LIFE: 4, SLOW: 5 };
const C = { GRAVITY: 0.5, ARROW_SPEED: 60, YAK_X: 180, GROUND_H: 140, POWER_TIME: 600 };
const Sfx = {
    ctx: null, init: function() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    play: function(type, f1, f2, dur, vol) { if(!this.ctx) return; const o = this.ctx.createOscillator(); const g = this.ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f1, this.ctx.currentTime); if(f2) o.frequency.exponentialRampToValueAtTime(f2, this.ctx.currentTime+dur); g.gain.setValueAtTime(vol, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime+dur); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+dur); },
    shoot: () => Sfx.play('triangle', 600, 100, 0.1, 0.1), hit: () => Sfx.play('square', 150, 50, 0.1, 0.2), power: () => Sfx.play('sine', 400, 800, 0.5, 0.2), damage: () => Sfx.play('sawtooth', 100, 20, 0.3, 0.3),
};
const Game = {
    canvas: null, ctx: null, width: 0, height: 0, active: false, frame: 0,
    lives: 3, score: 0, speed: 4, powerType: 0, powerTimer: 0, timeScale: 1.0,
    yak: { y: 0, targetY: 0, bowDraw: 0 }, arrows: [], obs: [], sky: [], particles: [], mountains: [], flyTimer: 0, lastObsX: 0, shake: 0,
    init: function() { this.canvas = document.getElementById('game-canvas'); this.ctx = this.canvas.getContext('2d'); this.resize(); window.addEventListener('resize', () => this.resize()); window.addEventListener('keypress', (e) => this.input(e)); for(let i=0; i<4; i++) { let pts = []; for(let x=0; x < 4000; x+=100) { pts.push({x: x, y: 100 + Math.random()*150}); } this.mountains.push({pts: pts, color: i}); } this.active = true; Sfx.init(); requestAnimationFrame(() => this.loop()); },
    resize: function() { this.width = window.innerWidth; this.height = window.innerHeight; this.canvas.width = this.width; this.canvas.height = this.height; },
    start: function() { Sfx.init(); document.getElementById('click-start').style.display = 'none'; this.active = true; },
    loop: function() { requestAnimationFrame(() => this.loop()); if(!this.active) return; this.frame++; this.update(); this.draw(); },
    update: function() {
        if(this.frame % 900 === 0 && this.speed < 14) this.speed += 0.5;
        let modSpeed = this.speed; this.timeScale = 1.0;
        if (this.powerType === POWERS.SPEED) { modSpeed = 20; this.score += 2; } else if (this.powerType === POWERS.SLOW) { this.timeScale = 0.4; modSpeed *= 0.4; document.getElementById('slow-fx').style.opacity = 1; } else { document.getElementById('slow-fx').style.opacity = 0; this.score += modSpeed / 20; }
        document.getElementById('score').innerText = Math.floor(this.score);
        if (this.powerTimer > 0) { this.powerTimer--; let pct = (this.powerTimer / C.POWER_TIME) * 100; document.getElementById('p-fill').style.width = pct + "%"; if (this.powerTimer < 20 && (this.powerType === POWERS.LEVITATE || this.powerType === POWERS.SPEED)) { this.clearLanding(); } if (this.powerTimer <= 0) { this.powerType = 0; document.getElementById('power-ui').classList.remove('active'); this.yak.targetY = 0; } }
        if (this.powerType === POWERS.LEVITATE || this.powerType === POWERS.SPEED) { this.yak.targetY = -220; } else { this.yak.targetY = 0; }
        this.yak.y += (this.yak.targetY - this.yak.y) * 0.05; if(this.yak.bowDraw > 0) this.yak.bowDraw *= 0.8;
        let gap = this.width - this.lastObsX; let spawnRate = (this.powerType === POWERS.SPEED) ? 0.3 : 0.02;
        let isLanding = (this.powerTimer > 0 && this.powerTimer < 60 && (this.powerType === POWERS.LEVITATE || this.powerType === POWERS.SPEED));
        if (gap > 400 && Math.random() < spawnRate && !isLanding) this.spawnObs();
        if (this.flyTimer > 0) this.flyTimer--; else if (Math.random() < 0.01) { this.spawnFly(); if (Math.random() < 0.2) setTimeout(() => this.spawnFly(), 600); this.flyTimer = 400 + Math.random() * 400; }
        this.updateEntities(modSpeed);
    },
    updateEntities: function(speed) {
        this.mountains.forEach((m, idx) => { m.pts.forEach(p => { p.x -= (speed * 0.1 * (idx+1)) * this.timeScale; }); if(m.pts[0].x < -150) { let p = m.pts.shift(); p.x = m.pts[m.pts.length-1].x + 100; p.y = 100 + Math.random()*150; m.pts.push(p); } });
        for(let i=this.arrows.length-1; i>=0; i--) { let a = this.arrows[i]; a.vy += C.GRAVITY * this.timeScale; a.x += a.vx * this.timeScale; a.y += a.vy * this.timeScale; if(a.target) { let tx = a.target.x + 30; let ty = a.target.type==='FLY' ? a.target.y : (this.height - 150); if(Math.hypot(a.x - tx, a.y - ty) < 60) { if(a.target.type==='FLY') { this.activatePower(a.target.pId); let idx = this.sky.indexOf(a.target); if(idx > -1) this.sky.splice(idx, 1); } else { a.target.dead = true; Sfx.hit(); } this.spawnBoom(tx, ty, '#fff'); this.arrows.splice(i, 1); continue; } } if(a.y > this.height || a.x > this.width) this.arrows.splice(i, 1); }
        for(let i=this.obs.length-1; i>=0; i--) { let o = this.obs[i]; if(o.dead) { this.obs.splice(i,1); continue; } o.x -= speed; let safe = (this.powerType === POWERS.LEVITATE || this.powerType === POWERS.SPEED); if (!safe) { if(o.x < C.YAK_X + 60 && o.x > C.YAK_X - 20) { if(this.yak.y > -50) { this.takeDamage(); o.dead = true; } } } if(o.x < -100) this.obs.splice(i,1); }
        if(this.obs.length > 0) this.lastObsX = Math.max(...this.obs.map(o=>o.x)); else this.lastObsX = 0;
        for(let i=this.sky.length-1; i>=0; i--) { this.sky[i].x -= speed * 1.2; if(this.sky[i].x < -100) this.sky.splice(i,1); }
        for(let i=this.particles.length-1; i>=0; i--) { let p = this.particles[i]; p.x += p.vx * this.timeScale; p.y += p.vy * this.timeScale; p.life-=0.05; if(p.life <= 0) this.particles.splice(i,1); }
    },
    draw: function() {
        let sx = (Math.random()-0.5) * this.shake; let sy = (Math.random()-0.5) * this.shake; if(this.shake > 0) this.shake *= 0.9;
        this.ctx.clearRect(0,0,this.width, this.height);
        let grad = this.ctx.createLinearGradient(0,0,0,this.height); grad.addColorStop(0, '#0a1020'); grad.addColorStop(1, '#1b2735'); this.ctx.fillStyle = grad; this.ctx.fillRect(0,0,this.width,this.height);
        this.ctx.save(); this.ctx.translate(sx, sy);
        this.mountains.forEach((m, idx) => { let light = 15 + idx*5; this.ctx.fillStyle = \`hsl(210, 20%, \${light}%)\`; this.ctx.beginPath(); this.ctx.moveTo(0, this.height); m.pts.forEach(p => this.ctx.lineTo(p.x, this.height - p.y)); this.ctx.lineTo(this.width, this.height); this.ctx.fill(); });
        this.ctx.fillStyle = '#050505'; this.ctx.fillRect(0, this.height - C.GROUND_H, this.width, C.GROUND_H); this.ctx.strokeStyle = '#00ffff'; this.ctx.lineWidth = 2; this.ctx.shadowBlur = 10; this.ctx.shadowColor = '#00ffff'; this.ctx.beginPath(); this.ctx.moveTo(0, this.height - C.GROUND_H); this.ctx.lineTo(this.width, this.height - C.GROUND_H); this.ctx.stroke(); this.ctx.shadowBlur = 0;
        
        // --- SCORE PROTECTION MASK ---
        this.ctx.save(); 
        this.ctx.beginPath(); 
        this.ctx.rect(0, 0, this.width, this.height); 
        this.ctx.rect(0, 0, 350, 150); // Cut out top left
        this.ctx.clip("evenodd"); 
        this.drawStickYak(); 
        this.ctx.restore();

        this.ctx.fillStyle = '#ffd700'; this.arrows.forEach(a => { this.ctx.save(); this.ctx.translate(a.x, a.y); this.ctx.rotate(Math.atan2(a.vy, a.vx)); this.ctx.fillRect(0, -2, 40, 4); this.ctx.restore(); });
        this.obs.forEach(o => { let y = this.height - 150; this.ctx.shadowBlur = 20; this.ctx.shadowColor = '#ff0055'; this.ctx.strokeStyle = '#ff0055'; this.ctx.lineWidth = 4; this.ctx.beginPath(); this.ctx.arc(o.x+30, y, 60, 0, Math.PI*2); this.ctx.stroke(); this.ctx.shadowBlur = 0; this.ctx.fillStyle = '#fff'; this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle'; this.ctx.font = 'bold 70px "OuChan2"'; this.ctx.strokeStyle = '#000'; this.ctx.lineWidth = 3; this.ctx.strokeText(KEY_MAP[o.key] || o.key, o.x+30, y-5); this.ctx.fillText(KEY_MAP[o.key] || o.key, o.x+30, y-5); });
        this.sky.forEach(b => { let y = b.y + Math.sin(this.frame * 0.1) * 15; this.ctx.save(); this.ctx.translate(b.x, y); let wing = Math.abs(Math.sin(this.frame*0.2)) * 15; let grad = this.ctx.createLinearGradient(-10, -10, 10, 10); grad.addColorStop(0, '#00ffff'); grad.addColorStop(0.5, '#ff00ff'); grad.addColorStop(1, '#ffff00'); this.ctx.fillStyle = grad; this.ctx.shadowBlur = 20 + Math.sin(this.frame * 0.1) * 10; this.ctx.shadowColor = '#ffffff'; this.ctx.beginPath(); this.ctx.ellipse(-8, -wing, 35, 20, -0.5, 0, Math.PI*2); this.ctx.fill(); this.ctx.beginPath(); this.ctx.ellipse(8, -wing, 35, 20, 0.5, 0, Math.PI*2); this.ctx.fill(); this.ctx.shadowBlur=0; this.ctx.fillStyle='#fff'; this.ctx.font = 'bold 45px "OuChan2"'; this.ctx.strokeStyle = '#000'; this.ctx.lineWidth = 3; this.ctx.strokeText(KEY_MAP[b.key] || b.key, 0, 40); this.ctx.fillText(KEY_MAP[b.key] || b.key, 0, 40); this.ctx.font = '16px "Roboto Mono"'; let names = ["", "FLOAT", "DOUBLE", "SPEED", "LIFE", "SLOW"]; this.ctx.fillText(names[b.pId], 0, -30); this.ctx.restore(); });
        this.ctx.fillStyle = '#fff'; this.particles.forEach(p => { this.ctx.globalAlpha = p.life; this.ctx.fillRect(p.x, p.y, 4, 4); }); this.ctx.globalAlpha = 1; this.ctx.restore();
    },
    drawStickYak: function() {
        const x = C.YAK_X; const y = this.height - C.GROUND_H + this.yak.y; this.ctx.save(); this.ctx.translate(x, y); this.ctx.scale(0.7, 0.7); let t = this.frame * 0.35 * this.timeScale; let pA = Math.sin(t); let pB = Math.sin(t + Math.PI); let bounce = Math.abs(pA) * 6; let tilt = pA * 0.05; if (this.powerType === POWERS.LEVITATE || this.powerType === POWERS.SPEED) { bounce=0; tilt=0.1; } this.ctx.translate(0, -bounce); this.ctx.rotate(tilt); this.ctx.strokeStyle = '#ffffff'; this.ctx.lineWidth = 5; this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round'; this.ctx.shadowBlur = 10; this.ctx.shadowColor = 'rgba(255,255,255,0.5)';
        this.drawLeg(-20, 0, pB); this.drawLeg(50, 0, pB); this.ctx.beginPath(); this.ctx.moveTo(-40, -10); this.ctx.lineTo(70, -10); this.ctx.lineTo(70, 25); this.ctx.lineTo(-40, 25); this.ctx.closePath(); this.ctx.stroke(); this.ctx.beginPath(); this.ctx.moveTo(-30, -10); this.ctx.lineTo(-10, -35); this.ctx.lineTo(10, -10); this.ctx.stroke();
        this.ctx.save(); this.ctx.translate(80, -20); this.ctx.rotate(pA * 0.1); this.ctx.strokeRect(-12, -12, 25, 25); this.ctx.beginPath(); this.ctx.moveTo(0, -12); this.ctx.lineTo(-15, -35); this.ctx.stroke(); this.ctx.beginPath(); this.ctx.moveTo(0, -12); this.ctx.lineTo(15, -35); this.ctx.stroke(); this.ctx.restore();
        this.ctx.save(); this.ctx.translate(10, -10); this.ctx.rotate(-tilt); this.ctx.beginPath(); this.ctx.moveTo(0,0); this.ctx.lineTo(0,-45); this.ctx.stroke(); this.ctx.beginPath(); this.ctx.arc(0,-55, 12, 0, Math.PI*2); this.ctx.stroke(); let aimX = 35; let aimY = -35; this.ctx.beginPath(); this.ctx.moveTo(0, -35); this.ctx.lineTo(aimX, aimY); this.ctx.stroke(); this.ctx.translate(aimX, aimY); this.ctx.strokeStyle = '#00ffcc'; this.ctx.beginPath(); this.ctx.arc(0, 0, 25, -1.0, 1.0, false); this.ctx.stroke(); this.ctx.strokeStyle = '#fff'; this.ctx.lineWidth=1; let pull = this.yak.bowDraw * 15; this.ctx.beginPath(); this.ctx.moveTo(13, -21); this.ctx.lineTo(-pull, 0); this.ctx.lineTo(13, 21); this.ctx.stroke(); this.ctx.restore(); this.ctx.restore();
        this.drawLeg(50, 0, pA); this.drawLeg(-20, 0, pA); this.ctx.restore();
    },
    drawLeg: function(x, y, cycle) { let thigh = Math.sin(cycle) * 0.6; let knee = cycle < 0 ? Math.abs(cycle)*1.5 : 0; this.ctx.save(); this.ctx.translate(x, y+20); this.ctx.rotate(thigh); this.ctx.beginPath(); this.ctx.moveTo(0,0); this.ctx.lineTo(0, 30); this.ctx.stroke(); this.ctx.translate(0, 30); this.ctx.rotate(knee); this.ctx.beginPath(); this.ctx.moveTo(0,0); this.ctx.lineTo(0, 30); this.ctx.stroke(); this.ctx.restore(); },
    spawnObs: function() { let key = CHAR_POOL[Math.floor(Math.random()*CHAR_POOL.length)]; this.obs.push({ x: this.width, key: key, dead: false, isTargeted: false }); this.lastObsX = this.width; },
    spawnFly: function() { let ground = this.obs.map(o=>o.key); let safe = CHAR_POOL.filter(k => !ground.includes(k)); if(safe.length === 0) return; let key = safe[Math.floor(Math.random()*safe.length)]; let p = [1, 2, 3, 4, 5][Math.floor(Math.random()*5)]; let color = p===3?'#00ffff':(p===4?'#ff00ff':'#ffd700'); this.sky.push({ x: this.width, y: 150+Math.random()*150, key: key, pId: p, color: color, type: 'FLY' }); },
    clearLanding: function() { this.obs.forEach(o => { if (o.x > 100 && o.x < 300 && !o.dead) { o.dead = true; this.spawnBoom(o.x, this.height-150, '#fff'); } }); },
    fire: function(target) { Sfx.shoot(); this.yak.bowDraw = 1.0; let startX = C.YAK_X + 50; let startY = this.height - C.GROUND_H + this.yak.y - 45; let tx = target.x + 30; let ty = target.type === 'FLY' ? target.y : (this.height - 150); let dx = tx - startX; let t = dx / C.ARROW_SPEED; let vy = (ty - startY)/t - (0.5 * C.GRAVITY * t); this.arrows.push({ x: startX, y: startY, vx: C.ARROW_SPEED, vy: vy, target: target }); },
    activatePower: function(p) { Sfx.power(); this.powerType = p; this.powerTimer = C.POWER_TIME; let names = ["", "LEVITATION", "DOUBLE ARROW", "SPEED", "LIFE", "SLOW"]; if(p===4) { this.lives++; this.powerType=0; } else { document.getElementById('p-name').innerText = names[p]; document.getElementById('power-ui').classList.add('active'); } this.updateLives(); },
    spawnBoom: function(x, y, c) { for(let i=0; i<10; i++) this.particles.push({x,y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:1,c}); },
