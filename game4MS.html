<html lang="bo">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WQ62DL1S2M"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TibetanKeys | Jungle Rhythm (Level 4)</title>
    <link rel="icon" type="image/png" href="og.png">
    
    <style>
        @font-face { font-family: 'OuChan2'; src: url('Monlam Uni OuChan2.ttf'); }
        
        body, html { 
            margin: 0; padding: 0; 
            background: #001a1a; /* Frozen Rainforest (Deep Cyan/Black) */
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
            height: 100vh;
        }

        /* --- HUD --- */
        .hud {
            position: absolute; top: 20px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 40px;
            box-sizing: border-box; z-index: 10; pointer-events: none;
        }
        .score-box {
            text-align: center; color: #fff;
            background: rgba(0,0,0,0.4); padding: 10px 25px; border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .score-val { font-size: 2.5rem; font-weight: 900; color: #00e5ff; } /* Icy Cyan for L4 */
        .score-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; }

        /* Music Toggle Button */
        #music-toggle {
            pointer-events: auto;
            cursor: pointer;
            background: rgba(0,0,0,0.6);
            border: 2px solid #00e5ff;
            color: #00e5ff;
            border-radius: 50%;
            width: 50px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px;
            transition: 0.2s;
        }
        #music-toggle:hover { background: #00e5ff; color: #000; transform: scale(1.1); }
        #music-toggle.muted { border-color: #ff4444; color: #ff4444; }

        #game-canvas { display: block; width: 100%; height: 100%; }

        /* --- MODALS --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000;
            justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-card {
            background: #002633; border: 3px solid;
            padding: 40px; border-radius: 25px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            max-width: 450px; width: 90%;
            display: flex; flex-direction: column; gap: 10px;
        }

        #game-over-modal .modal-card { border-color: #ff4444; }
        .death-msg { color: #ff4444; font-size: 2rem; margin-bottom: 10px; font-weight: 900; }
        
        #victory-modal .modal-card { border-color: #00e5ff; background: linear-gradient(135deg, #001a1a, #004d40); }
        .win-msg { color: #00e5ff; font-size: 2.5rem; font-weight: 900; }
        
        .action-btn {
            border: none; padding: 15px 40px; font-size: 1.2rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; margin-top: 10px; width: 100%;
        }
        .btn-retry { background: #ff4444; color: #fff; }
        .btn-retry:hover { transform: scale(1.05); box-shadow: 0 0 20px #ff4444; }
        
        .btn-return { background: transparent; border: 2px solid #555; color: #aaa; }
        .btn-return:hover { border-color: #fff; color: #fff; }

        /* --- TUTORIAL --- */
        #tutorial {
            position: absolute; bottom: 15%; width: 100%; text-align: center;
            color: #00e5ff; font-size: 1.4rem; pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8); font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div class="score-box">
            <div class="score-label">Current Step</div>
            <div class="score-val" id="score">0</div>
        </div>
        
        <div id="music-toggle" onclick="toggleMusic()">🎵</div>

        <div class="score-box" style="border-bottom: 3px solid #00e5ff;">
            <div class="score-label" style="color:#00e5ff;">Banana At</div>
            <div class="score-val" style="color: #00e5ff;" id="banana-dist">30</div>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>
    <div id="tutorial">Type the <span style="color:#00e676">SAFE</span> character to jump!</div>

    <div id="game-over-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="death-msg">🐍 BITTEN!</div>
            <div style="color:#ccc; margin-bottom:10px;">The frozen snakes strike fast!</div>
            <button class="action-btn btn-retry" onclick="location.reload()">Try Again</button>
            <button class="action-btn btn-return" onclick="window.location.href='lessons.html'">Return to Map</button>
        </div>
    </div>

    <div id="victory-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="win-msg">VICTORY! 🍌</div>
            <div style="font-size: 60px;">🐒</div>
            <div style="color:#00e5ff; margin-bottom:10px;">Level 4 Mastered</div>
            <button class="action-btn" style="background:#00e5ff; color:#000;" onclick="location.reload()">Replay</button>
            <button class="action-btn btn-return" onclick="window.location.href='lessons.html'">Return to Map</button>
        </div>
    </div>

    <script>
        // --- SOUND ENGINE ---
        const sfx = {
            ctx: null,
            isMuted: false,
            isPlayingMusic: false,
            nextNoteTime: 0,
            
            init: function() {
                if(!this.ctx) { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
                if(this.ctx.state === 'suspended') { this.ctx.resume(); }
                if(!this.isPlayingMusic && !this.isMuted) {
                    this.isPlayingMusic = true;
                    this.nextNoteTime = this.ctx.currentTime + 0.5;
                    this.scheduleMusic();
                }
            },

            toggleMute: function() {
                this.isMuted = !this.isMuted;
                if(this.isMuted) {
                    this.isPlayingMusic = false;
                    if(this.ctx) this.ctx.suspend();
                } else {
                    if(this.ctx) this.ctx.resume();
                    if(!this.isPlayingMusic) {
                        this.isPlayingMusic = true;
                        this.nextNoteTime = this.ctx.currentTime + 0.1;
                        this.scheduleMusic();
                    }
                }
                const btn = document.getElementById('music-toggle');
                btn.className = this.isMuted ? 'muted' : '';
                btn.innerHTML = this.isMuted ? '🔇' : '🎵';
            },

            scheduleMusic: function() {
                if(!this.isPlayingMusic || this.isMuted) return;
                const tempo = 0.25; 
                // Ethereal/Mystic scale for Level 4
                const scale = [392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 783.99]; 
                
                while(this.nextNoteTime < this.ctx.currentTime + 1.0) {
                    if(Math.floor(this.nextNoteTime * 2) % 8 === 0) {
                        this.playOsc(196.00, 'triangle', 2.0, 0.05, this.nextNoteTime); // G3
                    }
                    if(Math.random() > 0.4) {
                        let note = scale[Math.floor(Math.random() * scale.length)];
                        this.playOsc(note, 'sine', 0.15, 0.05, this.nextNoteTime);
                    }
                    if(Math.random() > 0.5) {
                        this.playNoise(0.05, 0.02, this.nextNoteTime);
                    }
                    this.nextNoteTime += tempo;
                }
                requestAnimationFrame(() => this.scheduleMusic());
            },

            playOsc: function(freq, type, duration, vol, time) {
                if(this.isMuted) return;
                const t = time || this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(vol, t + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + duration);
            },

            playNoise: function(duration, vol, time) {
                if(this.isMuted) return;
                const t = time || this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'highpass'; filter.frequency.value = 2000;
                gain.gain.setValueAtTime(vol, t);
                gain.gain.linearRampToValueAtTime(0, t + duration);
                noise.connect(filter); filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(t);
            },

            playJump: function() {
                if(!this.ctx || this.isMuted) return;
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(200, t);
                osc.frequency.linearRampToValueAtTime(600, t + 0.1);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.1);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(t); osc.stop(t + 0.1);
            },
            playLand: function() { this.playOsc(100, 'triangle', 0.1, 0.05); },
            playError: function() {
                if(!this.ctx || this.isMuted) return;
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, t);
                osc.frequency.linearRampToValueAtTime(50, t + 0.2);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(t); osc.stop(t + 0.2);
            },
            playHiss: function() { this.playNoise(0.2, 0.05); },
            playWin: function() {
                if(!this.ctx || this.isMuted) return;
                const t = this.ctx.currentTime;
                this.playOsc(523.25, 'sine', 0.2, 0.1, t);
                this.playOsc(659.25, 'sine', 0.2, 0.1, t+0.1);
                this.playOsc(783.99, 'sine', 0.2, 0.1, t+0.2);
                this.playOsc(1046.50, 'sine', 0.4, 0.1, t+0.3);
            },
            playLose: function() {
                if(!this.ctx || this.isMuted) return;
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, t);
                osc.frequency.exponentialRampToValueAtTime(50, t + 0.5);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.5);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(t); osc.stop(t + 0.5);
            }
        };

        function toggleMusic() { sfx.toggleMute(); }

        // --- TIBETAN MAPS ---
        const NORMAL_MAP = { 'k':'ཀ','t':'ཏ','p':'པ','s':'ས','d':'ད','f':'ང','g':'ག','h':'ཧ','j':'ཇ','l':'ལ','z':'ཟ','x':'ཙ','c':'ཅ','v':'ཌ','b':'བ','n':'ན','m':'མ','q':'ཊ','w':'ཝ','e':'ེ','r':'ར','y':'ཡ','u':'ུ','i':'ི','o':'ོ', '[':'༷',']':'྄','\\':'༔',';':'ཌྷ','\'':'འ',',':'‚','.':'ྲ','/':'།','`':'༌','1':'༡','2':'༢','3':'༣','4':'༤','5':'༥','6':'༦','7':'༧','8':'༨','9':'༩','0':'༠','-':'ྀ','=':'ཾ',' ':' ' };
        const SHIFT_MAP = { 'k':'ཁ','t':'ཐ','p':'ཕ','a':'ཨ','s':'ཤ','d':'ཛ','f':'དྷ','g':'གྷ','h':'ྷ','j':'ཛྷ','l':'ླ','z':'ཞ','x':'ཚ','c':'ཆ','v':'ཎ','b':'བྷ','n':'ཉ','m':'ཥ','q':'ཋ','w':'ྭ','e':'ཻ','r':'ཪ','y':'ྱ','u':'ཱུ','i':'ྀ','o':'ཽ', '[':'ྂ',']':'༵','\\':'྅',';':'ཿ','\'':'ཱ',',':'‚','.':'ླ','/':'„','`':'༸','1':'༑','2':'༄༅','3':'༅','4':'“','5':'”','6':'༈','7':'༼','8':'༽','9':'(','0':')','-':'ཱྀ','=':'ྃ',' ':' ' };

        // --- LEVEL 4 ROSTER (8 CHARS + PUNCTUATION) ---
        const GAME_POOL = [
            'ར', 'ལ', 'ཤ', 'ས', // Row 7
            'ཧ', 'ཨ', '་', '།'  // Row 8 (with punctuation)
        ];

        // --- ENGINE ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // --- CONSTANTS ---
        const STEP_X = 300; 
        const BANANA_STEP = 30;

        // --- STATE ---
        let steps = [];
        let currentStepIdx = 0;
        let gameState = 'playing'; 
        let frame = 0;
        
        let cameraX = 0;
        let targetCameraX = 0;

        // Monkey Physics
        const monkey = {
            x: 0, y: 0,
            startX: 0, startY: 0,
            targetX: 0, targetY: 0,
            jumpTime: 0, 
            isJumping: false
        };

        let particles = [];
        let zzzParticles = [];
        let fireflies = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            monkey.y = height / 2;
            initFireflies();
        }
        window.addEventListener('resize', resize);

        function initFireflies() {
            fireflies = [];
            for(let i=0; i<50; i++) {
                fireflies.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    offset: Math.random() * Math.PI * 2
                });
            }
        }
        resize();

        // --- GENERATION LOGIC ---
        function createStep(index) {
            const baseY = height / 2;
            let paths = [];
            
            let forceSafe = false;
            if (steps.length > 0) {
                const prevStep = steps[steps.length - 1];
                if (prevStep.paths.length > 1) { forceSafe = true; }
            }

            let pathCount = 1;
            if (!forceSafe) {
                if (index > 2) pathCount = 2; // Level 4: Complex from start
                if (index > 8) pathCount = 3; // Level 4: 3-ways very early
            }
            if (index === BANANA_STEP) pathCount = 1;

            let usedChars = [];
            let offsets = [0];
            if(pathCount === 2) offsets = [-80, 80];
            if(pathCount === 3) offsets = [-120, 0, 120];

            let canSnakesJump = false;
            // Level 4: Very aggressive snakes
            if(pathCount > 1) { canSnakesJump = Math.random() < 0.6; }

            for(let i=0; i<pathCount; i++) {
                let char = GAME_POOL[Math.floor(Math.random()*GAME_POOL.length)];
                while(usedChars.includes(char)) char = GAME_POOL[Math.floor(Math.random()*GAME_POOL.length)];
                usedChars.push(char);

                if(index === 0 || index === BANANA_STEP) { char = ""; }

                let hasSnake = false;
                if(pathCount === 2 && i === 0) hasSnake = Math.random() > 0.5;
                if(pathCount === 2 && i === 1 && !paths[0].hasSnake) hasSnake = true;
                if(pathCount === 3) { hasSnake = Math.random() > 0.33; }
                
                if(index === BANANA_STEP || index === 0) hasSnake = false;

                // FOLIAGE (Blue/Cyan/White palette)
                let foliage = [];
                let count = 8 + Math.floor(Math.random() * 6);
                for(let l=0; l<count; l++) {
                    let isFlower = Math.random() > 0.65; 
                    let hasButterfly = isFlower && Math.random() > 0.6; 
                    foliage.push({
                        lx: (Math.random()-0.5)*100, 
                        ly: (Math.random()-0.5)*35, 
                        rot: Math.random() * Math.PI,
                        scale: 0.5 + Math.random() * 0.8,
                        color: isFlower ? ['#00e5ff','#18ffff','#84ffff','#b388ff','#80d8ff','#40c4ff'][Math.floor(Math.random()*6)] : (Math.random() > 0.5 ? '#004d40' : '#00695c'),
                        type: ['round', 'long', 'fern', 'star'][Math.floor(Math.random()*4)],
                        isFlower: isFlower,
                        hasButterfly: hasButterfly,
                        butterflyOffset: Math.random(),
                        butterflyColor: ['#e0f7fa', '#80d8ff', '#a7ffeb'][Math.floor(Math.random()*3)]
                    });
                }

                paths.push({
                    char: char,
                    offset: offsets[i],
                    hasSnake: hasSnake,
                    snakeY: offsets[i],        
                    snakeTargetY: offsets[i],  
                    snakeOpacity: 1.0,
                    snakeGhostTarget: 1.0,
                    foliage: foliage
                });
            }

            if(pathCount > 1) {
                let snakeCount = paths.filter(p => p.hasSnake).length;
                if(snakeCount === pathCount) {
                    let safeIndex = Math.floor(Math.random() * pathCount);
                    paths[safeIndex].hasSnake = false;
                }
            }

            return {
                index: index,
                x: 200 + (index * STEP_X),
                y: baseY,
                paths: paths,
                canSnakesJump: canSnakesJump,
                mechanicTimer: Math.random() * 100
            };
        }

        function initGame() {
            steps = [];
            for(let i=0; i<=BANANA_STEP; i++) {
                steps.push(createStep(i));
            }
            
            currentStepIdx = 0;
            gameState = 'playing'; 
            
            monkey.x = steps[0].x;
            monkey.y = steps[0].y;
            monkey.targetX = monkey.x;
            monkey.targetY = monkey.y;
            
            cameraX = monkey.x - 200;
            targetCameraX = cameraX;

            document.getElementById('score').innerText = 0;
            document.getElementById('banana-dist').innerText = BANANA_STEP;
            document.getElementById('game-over-modal').style.display = 'none';
            document.getElementById('victory-modal').style.display = 'none';
            document.getElementById('tutorial').style.display = 'block';
        }

        // --- INPUT ---
        window.addEventListener('keydown', (e) => {
            sfx.init();
            if (gameState !== 'playing' || monkey.isJumping) return;
            const physicalKey = e.key.toLowerCase();
            let typedChar = (e.shiftKey ? SHIFT_MAP[physicalKey] : NORMAL_MAP[physicalKey]) || "";
            
            // SPECIAL PUNCTUATION HANDLING
            if(e.code === "Space") typedChar = e.shiftKey ? " " : "་";
            
            if(!typedChar) return;

            const nextStep = steps[currentStepIdx + 1];
            if(!nextStep) return;

            const match = nextStep.paths.find(p => p.char === typedChar);

            if(match) {
                sfx.playJump();
                if(match.hasSnake && match.snakeOpacity > 0.3) {
                    doJump(nextStep.x, nextStep.y + match.offset, true);
                } else {
                    doJump(nextStep.x, nextStep.y + match.offset, false);
                }
            } else {
                sfx.playError();
                cameraX += (Math.random() * 20) - 10;
            }
        });

        // --- PHYSICS ---
        function doJump(tx, ty, isDeathJump) {
            monkey.isJumping = true;
            monkey.jumpTime = 0;
            monkey.startX = monkey.x;
            monkey.startY = monkey.y;
            monkey.targetX = tx;
            monkey.targetY = ty;
            
            if(isDeathJump) {
                setTimeout(() => { gameState = 'dead'; gameOver(); }, 600);
            } else {
                currentStepIdx++;
                document.getElementById('score').innerText = currentStepIdx;
                document.getElementById('banana-dist').innerText = BANANA_STEP - currentStepIdx;
                if(currentStepIdx > 0) document.getElementById('tutorial').style.display = 'none';
                
                if(currentStepIdx === BANANA_STEP - 1) {
                    setTimeout(() => {
                        const bananaStep = steps[BANANA_STEP];
                        sfx.playJump();
                        doJump(bananaStep.x, bananaStep.y + bananaStep.paths[0].offset, false);
                    }, 400);
                }
                if(currentStepIdx === BANANA_STEP) {
                    setTimeout(() => { gameWin(); }, 600);
                }
            }
        }

        function updatePhysics() {
            if(monkey.isJumping) {
                monkey.jumpTime += 0.03; 
                if(monkey.jumpTime >= 1) {
                    monkey.jumpTime = 1;
                    monkey.isJumping = false;
                    monkey.x = monkey.targetX;
                    monkey.y = monkey.targetY;
                    sfx.playLand();
                    spawnParticles(monkey.x, monkey.y, '#00e5ff', 10);
                } else {
                    const t = monkey.jumpTime;
                    const easeT = t * (2 - t); 
                    monkey.x = monkey.startX + (monkey.targetX - monkey.startX) * easeT;
                    const linearY = monkey.startY + (monkey.targetY - monkey.startY) * easeT;
                    const jumpHeight = 150;
                    const arc = Math.sin(t * Math.PI); 
                    monkey.y = linearY - (arc * jumpHeight);
                }
            } else {
                monkey.y = monkey.targetY + Math.sin(frame * 0.1) * 5;
            }

            targetCameraX = monkey.x - 250;
            cameraX += (targetCameraX - cameraX) * 0.08; 

            // Snake Logic (L4: FASTER SWITCHES)
            for(let i = currentStepIdx + 1; i < Math.min(steps.length, currentStepIdx + 5); i++) {
                let step = steps[i];
                if(step.index === BANANA_STEP) continue;
                step.mechanicTimer++;
                // Faster switch time (180 frames vs 240)
                if(step.canSnakesJump && step.paths.length >= 2 && step.mechanicTimer > 180) {
                      step.mechanicTimer = 0;
                      let snakeIndices = [];
                      step.paths.forEach((p, idx) => { if(p.hasSnake) snakeIndices.push(idx); });
                      step.paths.forEach(p => p.hasSnake = false);
                      snakeIndices.forEach(oldIdx => {
                          let newIdx = (oldIdx + 1) % step.paths.length;
                          step.paths[newIdx].hasSnake = true;
                          step.paths[newIdx].snakeY = step.paths[oldIdx].offset;
                          step.paths[newIdx].snakeTargetY = step.paths[newIdx].offset;
                      });
                      sfx.playHiss();
                      spawnParticles(step.x, step.y, '#ff4444', 10);
                }
                step.paths.forEach(path => {
                    if(Math.abs(path.snakeY - path.snakeTargetY) > 0.1) {
                        path.snakeY += (path.snakeTargetY - path.snakeY) * 0.15;
                    }
                    if(!path.hasSnake) return;
                    if(frame % 60 === 0) {
                        path.snakeGhostTarget = Math.random() > 0.3 ? 1.0 : 0.05; 
                    }
                    path.snakeOpacity += (path.snakeGhostTarget - path.snakeOpacity) * 0.05;
                    if(path.snakeOpacity < 0.3 && frame % 40 === 0) {
                        spawnZZZ(step.x + 15, step.y + path.snakeY - 35);
                    }
                });
            }

            fireflies.forEach(f => {
                f.x += f.vx; f.y += f.vy;
                let relX = (f.x - cameraX) % width;
                if (relX < 0) relX += width;
                f.drawX = cameraX + relX; 
                if(f.y < 0) f.y = height; if(f.y > height) f.y = 0;
            });
        }

        // --- DRAWING ---
        function loop() {
            frame++;
            updatePhysics();

            let bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#001a1a'); bgGrad.addColorStop(1, '#002626');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0,0,width,height);

            drawMovingFireflies();

            ctx.save();
            ctx.translate(-cameraX, 0);

            drawVines();

            steps.forEach(step => {
                if(step.x < cameraX - 200 || step.x > cameraX + width + 200) return;
                if(step.index === BANANA_STEP) { drawBanana(step.x, step.y); return; }

                step.paths.forEach(path => {
                    const px = step.x; const py = step.y + path.offset;
                    
                    path.foliage.forEach(leaf => {
                        ctx.save();
                        ctx.translate(px + leaf.lx, py + leaf.ly + 5);
                        ctx.rotate(leaf.rot + Math.sin(frame*0.05)*0.1);
                        ctx.scale(leaf.scale, leaf.scale);
                        if(leaf.isFlower) {
                            drawAttractiveFlower(0,0, leaf.color);
                            if(leaf.hasButterfly) { drawButterfly(0, -10, leaf.butterflyOffset, leaf.butterflyColor); }
                        } else {
                            drawLeafShape(0,0, leaf.type, leaf.color);
                        }
                        ctx.restore();
                    });

                    ctx.fillStyle = '#5d4037'; 
                    ctx.beginPath(); ctx.ellipse(px, py+10, 50, 15, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#2e7d32';
                    ctx.beginPath(); ctx.ellipse(px, py+6, 40, 8, 0, 0, Math.PI*2); ctx.fill();

                    if(path.hasSnake || Math.abs(path.snakeY - path.offset) > 1) {
                        let visualY = step.y + path.snakeY;
                        let opacity = path.hasSnake ? path.snakeOpacity : 1.0;
                        if(!path.hasSnake) opacity = 1.0 - (Math.abs(path.snakeY - path.snakeTargetY)/100); 
                        drawSnake(px, visualY - 10, opacity);
                    }

                    if(path.char !== "") {
                        ctx.fillStyle = '#ffffff'; 
                        ctx.font = 'bold 55px OuChan2'; 
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 8;
                        ctx.fillText(path.char, px, py - 5);
                        ctx.shadowBlur = 0; 
                    }
                });
            });

            drawMonkey();
            updateParticles();
            updateZZZ();

            ctx.restore();
            requestAnimationFrame(loop);
        }

        function drawMovingFireflies() {
            ctx.fillStyle = '#00e5ff';
            fireflies.forEach(f => {
                ctx.globalAlpha = 0.3 + Math.abs(Math.sin(frame * 0.05 + f.offset)) * 0.7;
                ctx.fillRect(f.drawX, f.y, 4, 4); 
            });
            ctx.globalAlpha = 1;
        }

        function drawAttractiveFlower(x, y, color) {
            ctx.fillStyle = color;
            for(let i=0; i<8; i++){
                ctx.beginPath();
                ctx.ellipse(x + Math.cos(i*Math.PI/4)*12, y + Math.sin(i*Math.PI/4)*12, 10, 5, i*Math.PI/4, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.6;
             for(let i=0; i<8; i++){
                ctx.beginPath();
                ctx.ellipse(x + Math.cos(i*Math.PI/4)*7, y + Math.sin(i*Math.PI/4)*7, 6, 3, i*Math.PI/4, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI*2); ctx.fill();
        }

        function drawButterfly(x, y, offset, color) {
            ctx.save(); ctx.translate(x, y);
            let flap = Math.sin(frame * 0.2 + offset);
            let wingWidth = 12 * Math.abs(flap);
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.ellipse(-6, 0, wingWidth, 10, -Math.PI/6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(6, 0, wingWidth, 10, Math.PI/6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#212121';
            ctx.beginPath(); ctx.ellipse(0, 0, 2, 8, 0, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function drawLeafShape(x, y, type, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            if(type === 'round') { ctx.ellipse(x, y, 15, 8, 0, 0, Math.PI*2); }
            else if (type === 'long') { ctx.ellipse(x, y, 20, 4, 0, 0, Math.PI*2); }
            else if (type === 'fern') { ctx.moveTo(x-15, y); ctx.lineTo(x, y-5); ctx.lineTo(x+15, y); ctx.lineTo(x, y+5); ctx.closePath(); }
            else if (type === 'star') {
                 for(let i=0; i<5; i++) {
                     ctx.lineTo(x + Math.cos(i*Math.PI*2/5)*15, y + Math.sin(i*Math.PI*2/5)*15);
                     ctx.lineTo(x + Math.cos((i+0.5)*Math.PI*2/5)*6, y + Math.sin((i+0.5)*Math.PI*2/5)*6);
                 }
                 ctx.closePath();
            }
            ctx.fill();
        }

        function drawSnake(x, y, opacity) {
            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.strokeStyle = '#e53935'; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.beginPath();
            const sway = Math.sin(frame * 0.15) * 5;
            ctx.moveTo(x + 15, y + 15);
            ctx.bezierCurveTo(x + 30, y + 15, x - 10, y + 5, x, y + sway); 
            ctx.bezierCurveTo(x + 10, y + sway - 5, x + 20, y - 20 + sway, x + 5, y - 25 + sway); 
            ctx.stroke();

            const hx = x + 5; const hy = y - 25 + sway;
            ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.arc(hx, hy, 10, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffea00'; ctx.beginPath(); ctx.arc(hx-4, hy-2, 3, 0, Math.PI*2); ctx.arc(hx+4, hy-2, 3, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(hx-4, hy-2, 1, 0, Math.PI*2); ctx.arc(hx+4, hy-2, 1, 0, Math.PI*2); ctx.fill();

            if(opacity > 0.5) {
                const tongueTick = Math.sin(frame * 0.5);
                if(tongueTick > 0.8) {
                    ctx.strokeStyle = '#ff1744'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(hx, hy-8); ctx.lineTo(hx, hy-18); ctx.lineTo(hx-3, hy-22); 
                    ctx.moveTo(hx, hy-18); ctx.lineTo(hx+3, hy-22); ctx.stroke();
                }
            }
            ctx.restore();
        }

        function drawMonkey() {
            const x = monkey.x;
            const y = monkey.y - 30; 
            const isJump = monkey.isJumping;
            const sway = isJump ? 0 : Math.sin(frame * 0.2) * 3;
            const legSwing = isJump ? 0 : Math.sin(frame * 0.3) * 10;

            ctx.fillStyle = '#ffb300'; ctx.strokeStyle = '#ffb300'; ctx.lineWidth = 8; ctx.lineCap = 'round';

            ctx.beginPath(); ctx.moveTo(x-10, y+10);
            ctx.quadraticCurveTo(x-40, y+Math.sin(frame*0.2)*20, x-30, y-20);
            ctx.strokeStyle = '#ff6f00'; ctx.lineWidth = 6; ctx.stroke();
            ctx.strokeStyle = '#ffb300'; ctx.lineWidth = 8; 

            ctx.beginPath(); ctx.moveTo(x-10, y-5); ctx.lineTo(x-20 + legSwing, y+15); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x-8, y+15); ctx.lineTo(x-15 - legSwing, y+35); ctx.stroke();

            ctx.beginPath(); ctx.ellipse(x, y, 22, 18, 0, 0, Math.PI*2); ctx.fill();
            
            ctx.beginPath(); ctx.arc(x, y-25, 18, 0, Math.PI*2); ctx.fill();

            ctx.beginPath(); ctx.arc(x-18, y-25, 6, 0, Math.PI*2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(x+18, y-25, 6, 0, Math.PI*2); ctx.fill(); 
            ctx.fillStyle = '#ffe0b2'; 
            ctx.beginPath(); ctx.arc(x-18, y-25, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+18, y-25, 3, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#ffecb3'; ctx.beginPath(); ctx.ellipse(x, y-22, 14, 12, 0, 0, Math.PI*2); ctx.fill();
            
            if(gameState === 'dead') {
                ctx.strokeStyle = '#000'; ctx.lineWidth=2;
                ctx.beginPath(); ctx.moveTo(x-5, y-25); ctx.lineTo(x-1, y-21); ctx.moveTo(x-1, y-25); ctx.lineTo(x-5, y-21); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x+1, y-25); ctx.lineTo(x+5, y-21); ctx.moveTo(x+5, y-25); ctx.lineTo(x+1, y-21); ctx.stroke();
            } else {
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(x-4, y-25, 2.5, 0, Math.PI*2); ctx.arc(x+4, y-25, 2.5, 0, Math.PI*2); ctx.fill();
            }

            ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
            ctx.beginPath(); 
            if(gameState === 'dead') ctx.arc(x, y-15, 4, Math.PI, 0); 
            else ctx.arc(x, y-18, 4, 0, Math.PI); 
            ctx.stroke();

            ctx.strokeStyle = '#ffb300'; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(x+10, y-5); ctx.lineTo(x+20 - legSwing, y+15); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x+8, y+15); ctx.lineTo(x+15 + legSwing, y+35); ctx.stroke();
        }

        function drawVines() {
            ctx.strokeStyle = '#4e342e'; ctx.lineWidth = 4;
            ctx.beginPath();
            for(let i=0; i<steps.length-1; i++) {
                if(steps[i].x < cameraX - 200 || steps[i].x > cameraX + width) continue;
                const s1 = steps[i]; const s2 = steps[i+1];
                ctx.moveTo(s1.x, s1.y);
                ctx.bezierCurveTo(s1.x+100, s1.y, s2.x-100, s2.y, s2.x, s2.y);
            }
            ctx.stroke();
        }

        function drawBanana(x, y) {
            ctx.save(); ctx.translate(x, y);
            const bounce = Math.sin(frame * 0.05) * 10;
            ctx.translate(0, bounce);
            ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 40;
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI*2); ctx.fill();
            ctx.font = '40px serif';
            ctx.textAlign = 'center'; ctx.textBaseline='middle';
            ctx.fillText('🍌', 0, 0);
            ctx.restore();
        }

        function spawnParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x:x, y:y, 
                    vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                    life: 1.0, color: color
                });
            }
        }

        function spawnZZZ(x, y) {
            zzzParticles.push({
                x: x + (Math.random()-0.5)*5, y: y, 
                vx: (Math.random()-0.5) * 0.5, vy: -1 - Math.random(), 
                life: 1.0, size: 12 + Math.random()*8
            });
        }

        function updateParticles() {
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
                if(p.life<=0) particles.splice(i,1);
            }
            ctx.globalAlpha = 1;
        }

        function updateZZZ() {
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#000'; ctx.shadowBlur = 2;
            for(let i=zzzParticles.length-1; i>=0; i--) {
                let z = zzzParticles[i];
                z.x += z.vx; z.y += z.vy; z.life -= 0.01;
                ctx.globalAlpha = z.life; 
                ctx.font = `bold ${z.size}px sans-serif`;
                ctx.fillText('Z', z.x, z.y);
                if(z.life<=0) zzzParticles.splice(i,1);
            }
            ctx.globalAlpha = 1; ctx.shadowBlur = 0;
        }

        function gameOver() {
            sfx.playLose();
            document.getElementById('game-over-modal').style.display = 'flex';
        }
        function gameWin() {
            sfx.playWin();
            document.getElementById('victory-modal').style.display = 'flex';
        }

        initGame();
        loop();

    </script>
</body>
