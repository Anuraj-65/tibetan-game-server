<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TibetanKeys | Play</title>

    <style>
        @font-face { font-family: 'OuChan2'; src: url('Monlam Uni OuChan2.ttf'); }

        /* CRITICAL RESET */
        * { box-sizing: border-box; }

        :root { 
            --bg: #000000; 
            --accent: #d4af37; 
            --text: #ffffff; 
            --error: #ff4d4d; 
            --success: #00e676; 
            --blue-glow: #00ffff;
            --cursor-bg: rgba(0, 255, 255, 0.15);
            --cursor-border: rgba(0, 255, 255, 0.5);
            /* SNOW LION COLORS */
            --frost-cyan: #00ffff;
            --frost-white: #ffffff;
        }
        
        body, html { 
            margin: 0; padding: 0;
            background: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', sans-serif; 
            height: 100vh; width: 100vw;
            overflow: hidden; 
            display: flex; flex-direction: column; 
            user-select: none;
        }

        /* --- LAYOUT SIZES --- */
        body.layout-large  { --dynamic-font-size: 90px; --stage-height: 40vh; }
        body.layout-medium { --dynamic-font-size: 110px; --stage-height: 55vh; }
        body.layout-small  { --dynamic-font-size: 130px; --stage-height: 70vh; }
        body.layout-clean  { --dynamic-font-size: 160px; --stage-height: 90vh; }

        /* --- PRELOADER --- */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 20000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.5s ease-out;
        }
        .loader-dots { display: flex; gap: 12px; }
        .dot { width: 15px; height: 15px; background-color: var(--accent); border-radius: 50%; box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { animation-delay: 0s; }
        .dot:nth-child(4) { animation-delay: 0.16s; }
        .dot:nth-child(5) { animation-delay: 0.32s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 20px var(--accent); } }

        /* --- HUD --- */
        .hud { 
            width: 100%; height: 80px; padding: 0 40px; 
            background: rgba(10, 10, 12, 0.95); 
            border-bottom: 1px solid rgba(212, 175, 55, 0.15); 
            flex-shrink: 0; z-index: 100;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        }
        .level-info { justify-self: start; }
        .level-info h1 { margin: 0; font-size: 14px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; font-weight: 700; }
        .controls-group { justify-self: center; display: flex; align-items: center; gap: 15px; }
        .phase-indicator { justify-self: end; font-size: 12px; letter-spacing: 3px; color: var(--success); text-transform: uppercase; font-weight: bold; white-space: nowrap; }

        /* --- BUTTONS --- */
        .icon-btn {
            background: none; border: none; color: #888;
            cursor: pointer; width: 44px; height: 44px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 8px; transition: all 0.2s ease;
        }
        .icon-btn:hover { color: #fff; } 
        .icon-btn.active { color: #fff !important; background: transparent !important; }
        #btn-hand { color: #888; background: transparent !important; }
        #btn-hand.active { color: #fff !important; }
        .icon-btn.disabled { opacity: 0.3; cursor: not-allowed; }
        .icon-btn svg { width: 22px; height: 22px; fill: currentColor; } 

        /* --- DROPDOWN --- */
        .dropdown { position: relative; height: 44px; display: flex; align-items: center; }
        .dropdown-menu {
            display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 5px; min-width: 140px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 200; margin-top: 10px; 
        }
        .dropdown-menu::before { content: ''; position: absolute; top: -15px; left: 0; width: 100%; height: 15px; background: transparent; }
        .dropdown:hover .dropdown-menu { display: block; }
        .dropdown-item {
            width: 100%; text-align: left; padding: 10px 15px; font-size: 12px; color: #aaa;
            background: none; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            transition: 0.2s; border-radius: 4px;
        }
        .dropdown-item:hover { background: #333; color: #fff; }
        .dropdown-item.selected { color: var(--accent); font-weight: bold; background: rgba(212, 175, 55, 0.1); }

        .size-controls { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.05); padding: 3px; border-radius: 6px; border: 1px solid #333; height: 40px; }
        .size-btn { background: none; border: none; color: #888; font-size: 14px; cursor: pointer; font-weight: bold; width: 32px; height: 100%; display: flex; justify-content: center; align-items: center; transition: 0.2s; border-radius: 4px; }
        .size-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        /* --- STAGE & KEYBOARD --- */
        .stage { flex: 1; display: flex; flex-direction: column; width: 100%; overflow: hidden; position: relative; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.8s ease-in; }
        .target-container { width: 90%; max-width: 1200px; height: var(--stage-height); display: block; overflow-y: auto; overflow-x: hidden; background: transparent; padding: 40px 0; scroll-behavior: smooth; text-align: center; }
        .target-container::-webkit-scrollbar { width: 0; background: transparent; }
        .target-text { font-family: 'OuChan2', serif; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; width: 100%; gap: 15px; row-gap: 20px; line-height: 1.6; transition: all 0.3s ease; font-size: var(--dynamic-font-size); padding: 10vh 0; }
        .char { opacity: 0.3; transition: all 0.15s ease; position: relative; display: inline-block; min-width: 0.6em; text-align: center; padding: 5px 8px; border-radius: 8px; border: 1px solid transparent; vertical-align: middle; }
        .char.current { opacity: 1; color: #fff; transform: scale(1.1); z-index: 10; background: var(--cursor-bg); border-color: var(--cursor-border); box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1); text-shadow: 0 0 10px rgba(255,255,255,0.8); }
        .char.correct { opacity: 0.8; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .char.wrong { opacity: 1; color: var(--error); animation: shake 0.3s; }
        .char.space-char { display: none; } 
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        #keyboard-wrapper { width: 100%; max-width: 1000px; aspect-ratio: 950 / 400; margin: 0 auto; flex-shrink: 0; position: relative; z-index: 20; transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); overflow: visible !important; }
        body.layout-large #keyboard-wrapper  { height: 55vh; opacity: 1; margin-bottom: 10px;}
        body.layout-medium #keyboard-wrapper { height: 35vh; opacity: 1; margin-bottom: 20px;}
        body.layout-small #keyboard-wrapper  { height: 25vh; opacity: 1; margin-bottom: 30px;}
        body.layout-clean #keyboard-wrapper  { height: 0; opacity: 0; pointer-events: none; margin-bottom: 0;}
        body.hands-hidden #layer-hands-container { display: none; }
        #layer-keyboard { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; filter: drop-shadow(0 -20px 40px rgba(0,0,0,0.8)); z-index: 1; }
        #layer-hands-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        #layer-hands-container svg { width: 100%; height: 100%; display: block; preserveAspectRatio: xMidYMid meet; }
        #active-finger { fill: url(#finger-gradient) !important; stroke: #00ffff !important; stroke-width: 0.5px !important; filter: drop-shadow(0 0 10px #00ffff) drop-shadow(0 0 20px #00ffff) !important; opacity: 1 !important; }
        #layer-hands-container svg g:not(#active-finger), #layer-hands-container svg path:not(#active-finger) { opacity: 0.5; }
        .st0 { fill: #d4af37; font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; pointer-events: none; }
        .st1 { fill: none; opacity: .5; stroke: #d4af37; stroke-width: 1.5px; transition: all 0.1s; }
        .st2 { fill: transparent; } 
        .key-guide { stroke: var(--blue-glow) !important; stroke-width: 3px !important; fill: rgba(0, 255, 255, 0.15) !important; opacity: 1 !important; filter: drop-shadow(0 0 15px var(--blue-glow)); }
        .key-hit { fill: var(--success) !important; stroke: var(--success) !important; filter: drop-shadow(0 0 15px var(--success)); transition: 0s; }

        /* =========================================
           VICTORY CONSTELLATION (DUAL DISPLAY)
           ========================================= */
        #result-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center; 
            backdrop-filter: blur(15px); overflow: hidden; /* FIX JUMP */
        }
        
        /* Snow Lion Aura (Initially Hidden) */
        .snowlion-aura {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('badges/snowlion.svg'); 
            background-repeat: no-repeat; background-position: center; background-size: 80%;
            opacity: 0; pointer-events: none; z-index: 0;
            transition: opacity 2s ease-in;
        }
        .snowlion-aura.active { opacity: 0.15; }

        .victory-container {
            display: grid;
            grid-template-columns: 1fr 400px 1fr; /* Left Stage | Center Box | Right Stage */
            width: 95%; max-width: 1400px;
            height: 100vh; /* LOCK HEIGHT */
            max-height: 100vh;
            align-items: center;
            position: relative; z-index: 1;
        }

        /* CENTER BOX (THE PERMANENT RECORD) */
        .center-box {
            background: rgba(0, 15, 10, 0.95);
            border: 2px solid var(--success);
            padding: 30px; text-align: center;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,230,118,0.1);
            display: flex; flex-direction: column; gap: 20px;
            height: fit-content;
            transition: all 0.3s ease;
        }
        .center-box.legendary { border-color: var(--frost-cyan); box-shadow: 0 0 60px var(--frost-cyan); }

        .res-title { color: var(--success); font-size: 20px; letter-spacing: 4px; text-transform: uppercase; font-weight: 800; margin: 0; }
        .center-box.legendary .res-title { color: var(--frost-cyan); text-shadow: 0 0 10px var(--frost-cyan); }

        .res-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .res-val { font-size: 28px; font-weight: bold; color: #fff; }
        .res-label { font-size: 9px; color: #888; letter-spacing: 2px; text-transform: uppercase; }

        /* THE COLLECTION ROW */
        .collection-label { font-size: 10px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        .collection-row {
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;
            min-height: 80px; align-items: center; 
        }
        
        .mini-icon { 
            width: 64px; height: 64px; 
            opacity: 0; transform: scale(0); 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.2));
        }
        .mini-icon.show { opacity: 1; transform: scale(1); }

        /* PROMPTS */
        .prompt-container {
            display: flex; flex-direction: column; gap: 8px; margin-top: 15px;
            animation: pulse 2s infinite; width: 100%;
        }
        .prompt-keys-row, .prompt-actions-row { display: flex; justify-content: center; gap: 25px; width: 100%; }
        .prompt-key {
            color: #fff; font-weight: bold; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
            border: 1px solid #555; background: rgba(255,255,255,0.05); padding: 4px 10px;
            border-radius: 6px; min-width: 60px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .prompt-action { color: #888; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; min-width: 60px; text-align: center; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* SIDE STAGES */
        .side-stage { 
            height: 100%; display: flex; flex-direction: column; 
            justify-content: center; gap: 20px; 
            pointer-events: none; 
            padding: 20px;
        }
        
        /* STANDARD POPUP CARD */
        .popup-card {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            opacity: 0; transform: translateY(20px); transition: all 0.5s ease;
            background: transparent; padding: 15px; border: none;
        }
        .popup-card.show { opacity: 1; transform: translateY(0); }
        .popup-icon { width: 100px; height: 100px; margin-bottom: 10px; filter: drop-shadow(0 0 15px var(--accent)); transition: all 0.3s; }
        .popup-title { font-size: 18px; color: var(--accent); font-weight: bold; text-transform: uppercase; margin-bottom: 5px; transition: all 0.3s; }
        .popup-reason { 
            font-size: 12px; color: var(--success); font-weight: bold; 
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
        }
        .popup-desc { 
            font-size: 12px; color: #ccc; font-style: italic; line-height: 1.4; max-width: 80%; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); 
        }

        /* --- COMPACT MODE (DYNAMIC DENSITY) --- */
        .victory-container.compact-layout .side-stage { gap: 5px; } /* Tighten vertical gap */
        .victory-container.compact-layout .popup-card { padding: 5px; } /* Reduce padding */
        .victory-container.compact-layout .popup-icon { width: 60px; height: 60px; margin-bottom: 5px; } /* Shrink Icons */
        .victory-container.compact-layout .popup-title { font-size: 14px; margin-bottom: 2px; } /* Shrink Title */
        .victory-container.compact-layout .popup-desc { font-size: 10px; line-height: 1.2; max-width: 95%; } /* Shrink Text */

        .back-btn { 
            position: fixed; bottom: 20px; left: 30px; 
            color: #666; text-decoration: none; 
            font-size: 11px; letter-spacing: 2px; text-transform: uppercase; 
            transition: 0.3s; z-index: 50; display: flex; align-items: center; gap: 8px; 
        }
        .back-btn:hover { color: var(--accent); }

        @media (max-width: 1000px) {
            .victory-container { grid-template-columns: 1fr; grid-template-rows: auto auto; height: 90vh; overflow-y: auto; }
            .side-stage { display: none; } 
            .collection-row { min-height: auto; }
        }
    </style>
</head>

        };

        const NORMAL_MAP = { 'k':'ཀ','t':'ཏ','p':'པ','s':'ས','d':'ད','f':'ང','g':'ག','h':'ཧ','j':'ཇ','l':'ལ','z':'ཟ','x':'ཙ','c':'ཅ','v':'ཌ','b':'བ','n':'ན','m':'མ','q':'ཊ','w':'ཝ','e':'ེ','r':'ར','y':'ཡ','u':'ུ','i':'ི','o':'ོ', '[':'༷',']':'྄','\\':'༔',';':'ཌྷ','\'':'འ',',':'‚','.':'ྲ','/':'།','`':'༌','1':'༡','2':'༢','3':'༣','4':'༤','5':'༥','6':'༦','7':'༧','8':'༨','9':'༩','0':'༠','-':'ྀ','=':'ཾ',' ':' ' };

            { type: "tibetan", text: "པ ཕ བ མ", footer: "ALPHABET" },

            { type: "special", text: "GAME II", footer: "REWARD" },

        const urlParams = new URLSearchParams(window.location.search);
        const levelIndex = parseInt(urlParams.get('level') || "1");
        const isTestMode = urlParams.get('mode') === 'test';

        let currentLesson = basicLessons[levelIndex];
        let baseChars = [];

        if (currentLesson.text === "TEST I") baseChars = "ཀཁགངཅཆཇཉ".split('');
        else if (currentLesson.text === "TEST II") baseChars = "ཏཐདནཔཕབམ".split('');

        else baseChars = currentLesson.text.replace(/ /g, '').split('');

        let targetString = "";
        let currentIndex = 0;
        let isPhase1 = !isTestMode; 
        let phase1RepCount = 0; 
        let drillStarted = isTestMode;

        // ... [ASSET LOADING CODE SAME AS BEFORE] ...
        function preloadAssets() {
            const uniqueChars = [...new Set(baseChars)];
            const assetsToLoad = [];
            assetsToLoad.push(poseMap['default']);
            uniqueChars.forEach(char => { if (poseMap[char]) assetsToLoad.push(poseMap[char]); });
            let loaded = 0;
            if (assetsToLoad.length === 0) { hidePreloader(); return; }
            assetsToLoad.forEach(src => {
                fetch(src).then(r => r.text()).then(text => {
                    let cleanText = text.replace(/<svg([^>]*)>/, '<svg$1 width="100%" height="100%" preserveAspectRatio="xMidYMid meet">');
                    svgCache[src] = cleanText; 
                    loaded++; if (loaded === assetsToLoad.length) hidePreloader();
                }).catch(() => { loaded++; if (loaded === assetsToLoad.length) hidePreloader(); });
            });
        }
        function hidePreloader() {
            document.fonts.ready.then(() => {
                setTimeout(() => { preloader.style.opacity = '0'; setTimeout(() => { preloader.style.display = 'none'; startActionPhase(); stage.style.opacity = '1'; }, 500); }, 200); 
            });
        }

        window.addEventListener('load', () => { loadPreferences(); prepareLevel(); preloadAssets(); });

        function loadPreferences() {
            const savedLayout = localStorage.getItem(PREF_LAYOUT);
            if (savedLayout) setLayout(savedLayout, false); else setLayout('layout-large', false);
            const handsHidden = localStorage.getItem(PREF_HANDS) === 'true';
            if (handsHidden) toggleHands(false);
            const isMuted = localStorage.getItem(PREF_SOUND) === 'true';
            if (isMuted) { sfx.muted = true; document.getElementById('sound-btn').classList.add('muted'); }
            const savedSize = localStorage.getItem(PREF_TEXT_SIZE);
            if (savedSize) { currentFontSize = parseInt(savedSize); if(window.innerWidth > 768) display.style.fontSize = currentFontSize + "px"; }
        }

        function toggleHands(save=true) { document.body.classList.toggle('hands-hidden'); if(save) localStorage.setItem(PREF_HANDS, document.body.classList.contains('hands-hidden')); }
        function setLayout(mode, save=true) { 
            document.body.classList.remove('layout-large', 'layout-medium', 'layout-small', 'layout-clean');
            document.body.classList.add(mode); currentLayout = mode;
            if(save) localStorage.setItem(PREF_LAYOUT, mode);
            setTimeout(scrollToCursor, 100);
        }
        function adjustFontSize(delta) { currentFontSize = Math.max(10, Math.min(300, currentFontSize + delta)); localStorage.setItem(PREF_TEXT_SIZE, currentFontSize); if(window.innerWidth > 768) display.style.fontSize = currentFontSize + "px"; }

        function prepareLevel() { if (!isTestMode) targetString = baseChars.join(''); else targetString = generateDrillString(100); }
        function startActionPhase() { renderString(); if(isTestMode && !startTime) startTime = new Date(); }
        function generateDrillString(len) { let s=""; for(let i=0;i<len;i++) s+=baseChars[Math.floor(Math.random()*baseChars.length)]; return s; }
        
        function renderString() {
            display.innerHTML = '';
            const chars = targetString.split('');
            chars.forEach((char, i) => {
                const span = document.createElement('span'); span.innerText = char; span.className = 'char';
                if (i < currentIndex) span.classList.add('correct');
                if (i === currentIndex) span.classList.add('current');
                display.appendChild(span);
            });
            if(!isPhase1) setTimeout(() => { if(document.querySelectorAll('.char').length < 5) return; }, 50);
            updateGuide(); setTimeout(scrollToCursor, 50);
        }

        function startDrillPhase() { targetString = generateDrillString(60); currentIndex = 0; isPhase1 = false; phaseTxt.innerText = "Phase 2: Speed Drill"; if (currentLayout === 'layout-large') setLayout('layout-medium', false); renderString(); drillStarted = true; startTime = new Date(); }
        function scrollToCursor() { const el = document.querySelector('.char.current'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' }); }

        function updateGuide() {
            document.querySelectorAll('.key-guide').forEach(el => el.classList.remove('key-guide'));
            if (currentIndex >= targetString.length) return;
            const nextChar = targetString[currentIndex];
            const poseFile = poseMap[nextChar] || poseMap['default'];
            if (svgCache[poseFile] && handContainer.getAttribute('data-current') !== poseFile) {
                handContainer.innerHTML = svgCache[poseFile]; handContainer.setAttribute('data-current', poseFile);
            } else if (!svgCache[poseFile]) {
                fetch(poseFile).then(r=>r.text()).then(t=>{ handContainer.innerHTML = t.replace(/<svg([^>]*)>/, '<svg$1 width="100%" height="100%" preserveAspectRatio="xMidYMid meet">'); handContainer.setAttribute('data-current', poseFile); });
            }
            // Key Highlight Logic
            let key = "", shift = false;
            for(let [k,v] of Object.entries(NORMAL_MAP)) if(v===nextChar) { key=k; break; }
            if(!key) for(let [k,v] of Object.entries(SHIFT_MAP)) if(v===nextChar) { key=k; shift=true; break; }
            if(key) {
                highlightSVGKey(key, 'key-guide');
                if(shift) highlightShiftKey(LEFT_HAND_KEYS.includes(key)?'right':'left', 'key-guide');
            }
        }

        function highlightSVGKey(k, cls) {
            const t = (k===" ") ? "SPACEBAR" : k.toUpperCase();
            document.querySelectorAll('text.st0').forEach(txt => {
                if(txt.textContent.trim() === t || (t===";" && txt.textContent.trim()===";") || (t==="SPACEBAR" && txt.textContent.trim()==="SPACEBAR")) 
                    txt.parentElement.querySelector('rect.st1').classList.add(cls);
            });
        }
        function highlightShiftKey(side, cls) {
            const shifts = []; document.querySelectorAll('text.st0').forEach(t=>{if(t.textContent.trim()==="SHIFT") shifts.push(t)});
            if(shifts.length>=2) (side==='left'?shifts[0]:shifts[1]).parentElement.querySelector('rect.st1').classList.add(cls);
        }
        function triggerHitEffect(k) { let key=k; if(k===" ") key="SPACEBAR"; highlightSVGKey(key, 'key-hit'); setTimeout(()=>document.querySelectorAll('.key-hit').forEach(el=>el.classList.remove('key-hit')), 100); }

        // --- GAME INPUT ---
        window.addEventListener('keydown', (e) => {
            if (resultState !== 'hidden') {
                if(e.key === "Shift" || e.code === "ShiftLeft" || e.code === "ShiftRight") {
                    // RETRY: Reload current level with same params
                    window.location.reload();
                    return;
                }
                if(e.code === 'Space') {
                    if(resultState === 'animating') skipAnimation(earnedBadgesCache);
                    else window.location.href = 'lessons.html';
                }
                if(e.code === 'Enter' && resultState === 'finished') {
                    // Logic: Jump to Next Level if exists
                    if (levelIndex + 1 < basicLessons.length) {
                        const nextType = basicLessons[levelIndex+1].type;
                        if(nextType === 'special' && basicLessons[levelIndex+1].text.includes('GAME')) {
                            const gTxt = basicLessons[levelIndex+1].text;
                            if(gTxt.includes('I')) window.location.href = 'game1.html';
                            else if(gTxt.includes('II')) window.location.href = 'game2.html';
                            else if(gTxt.includes('III')) window.location.href = 'game3.html';
                            else if(gTxt.includes('IV')) window.location.href = 'game4.html';
                            else window.location.href = 'game.html';
                        } else if(nextType === 'special' && (basicLessons[levelIndex+1].text.includes('TEST') || basicLessons[levelIndex+1].text.includes('FINAL'))) {
                            window.location.href = `basic-room.html?level=${levelIndex+1}&mode=test`;
                        } else {
                            window.location.href = `basic-room.html?level=${levelIndex+1}`;
                        }
                    } else {
                        window.location.href = 'lessons.html';
                    }
                }
                return;
            }

            sfx.init(); 
            if (e.key === "Tab" || e.key === "Alt") { e.preventDefault(); return; }
            if (e.key === "Shift") return;

            triggerHitEffect(e.key);
            const spans = document.querySelectorAll('.char');
            if (currentIndex >= spans.length) return;

            const physicalKey = e.key.toLowerCase();
            let typedChar = (e.shiftKey ? SHIFT_MAP[physicalKey] : NORMAL_MAP[physicalKey]) || "";
            if (e.code === "Space") typedChar = " ";
            const targetChar = targetString[currentIndex];
            let isMatch = (typedChar === targetChar) || (targetChar === " " && e.code === "Space");

            if (isMatch) {
                sfx.playClick(); 
                spans[currentIndex].className = 'char correct';
                currentIndex++; charCount++;
                if (currentIndex < spans.length) { spans[currentIndex].className = 'char current'; updateGuide(); scrollToCursor(); }
                else {
                    if (isPhase1) {
                         if (phase1RepCount === 0) { phase1RepCount++; currentIndex = 0; targetString = baseChars.join('') + baseChars.join(''); renderString(); }
                         else setTimeout(startDrillPhase, 200);
                    } else finishLevel();
                }
            } else {
                errors++; sfx.playError();
                spans[currentIndex].classList.add('wrong'); setTimeout(() => spans[currentIndex].classList.remove('wrong'), 200);
            }
        });

        // --- VICTORY LOGIC ---
        function formatTime(ms) {
            const s = Math.floor(ms/1000);
            return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
        }

        function finishLevel() {
            localStorage.setItem('tk_lvl_' + levelIndex, 'true');
            const duration = new Date() - startTime;
            const wpm = Math.round((charCount / 5) / (duration / 60000)) || 0;
            const acc = Math.round(((charCount - errors) / charCount) * 100) || 100;
            
            // Calculate Badges
            earnedBadgesCache = [];
            let isLegendary = false;
            BADGE_DEFINITIONS.forEach(def => {
                if (def.check(wpm, acc)) {
                    earnedBadgesCache.push(def);
                    if(def.id === 'snowlion') isLegendary = true;
                }
            });

            // Save Data
            const stats = { wpm: wpm, acc: acc, time: formatTime(duration), badges: earnedBadgesCache.map(b=>b.id) };
            localStorage.setItem('tk_stats_' + levelIndex, JSON.stringify(stats));

            // Setup Center Box
            document.getElementById('res-wpm').innerText = wpm;
            document.getElementById('res-acc').innerText = acc + "%";
            document.getElementById('res-time').innerText = formatTime(duration);
            document.getElementById('center-badge-row').innerHTML = ''; // Clear old icons
            
            const centerBox = document.getElementById('center-box');
            const resMsg = document.getElementById('res-msg');
            const snowLionAura = document.getElementById('snowlion-aura');
            const victoryContainer = document.getElementById('victory-container');

            // RESET CLASSES
            centerBox.classList.remove('legendary');
            victoryContainer.classList.remove('compact-layout');
            snowLionAura.classList.remove('active');

            if (isLegendary) { 
                centerBox.classList.add('legendary'); 
                resMsg.innerText = "LEGENDARY ASCENT"; 
                // Activate Snow Lion Aura
                snowLionAura.classList.add('active');
            } else { 
                resMsg.innerText = "Level Mastered"; 
            }

            // AUTO COMPACT MODE if badges > 6 (e.g. 7 or more)
            // (Standard view holds 3 per side comfortably. 4 per side is tight.)
            if (earnedBadgesCache.length > 6) {
                victoryContainer.classList.add('compact-layout');
            }

            // Show Modal
            document.getElementById('result-modal').style.display = 'flex';
            
            // Start Animation Sequence
            resultState = 'animating';
            runAnimationSequence(earnedBadgesCache);
        }

        async function runAnimationSequence(badges) {
            const leftStage = document.getElementById('left-stage');
            const rightStage = document.getElementById('right-stage');
            const centerRow = document.getElementById('center-badge-row');
            
            leftStage.innerHTML = ''; rightStage.innerHTML = ''; // Clear previous

            for (let i = 0; i < badges.length; i++) {
                if (resultState !== 'animating') break; // Handle Skip

                const b = badges[i];
                // Distribute: Evens left, Odds right
                const side = (i % 2 === 0) ? leftStage : rightStage;
                
                // create Side Popup
                const card = document.createElement('div');
                card.className = 'popup-card';
                card.innerHTML = `
                    <img src="${b.img}" class="popup-icon">
                    <div class="popup-title">${b.title}</div>
                    <div class="popup-reason">${b.criteria}</div>
                    <div class="popup-desc">${b.desc}</div>
                `;
                side.appendChild(card);
                
                // Create Center Mini-Icon
                const mini = document.createElement('img');
                mini.src = b.img; mini.className = 'mini-icon';
                centerRow.appendChild(mini);

                // Trigger CSS Animation (Reflow hack)
                await new Promise(r => setTimeout(r, 50)); 
                card.classList.add('show');
                mini.classList.add('show');

                // Wait delay
                await new Promise(r => {
                    const t = setTimeout(r, 500); 
                    animationTimeouts.push(t);
                });
            }
            
            finishAnimation();
        }

        function skipAnimation(badges) {
            // Clear timeouts
            animationTimeouts.forEach(clearTimeout);
            animationTimeouts = [];

            const leftStage = document.getElementById('left-stage');
            const rightStage = document.getElementById('right-stage');
            const centerRow = document.getElementById('center-badge-row');

            // Immediate render of everything not yet shown
            // Actually, safest is to clear and re-render ALL immediately
            leftStage.innerHTML = ''; rightStage.innerHTML = ''; centerRow.innerHTML = '';

            badges.forEach((b, i) => {
                const side = (i % 2 === 0) ? leftStage : rightStage;
                
                const card = document.createElement('div');
                card.className = 'popup-card show'; // Add 'show' immediately
                card.innerHTML = `
                    <img src="${b.img}" class="popup-icon">
                    <div class="popup-title">${b.title}</div>
                    <div class="popup-reason">${b.criteria}</div>
                    <div class="popup-desc">${b.desc}</div>
                `;
                side.appendChild(card);

                const mini = document.createElement('img');
                mini.src = b.img; mini.className = 'mini-icon show';
                centerRow.appendChild(mini);
            });

            finishAnimation();
        }

        function finishAnimation() {
            resultState = 'finished';
            const promptCont = document.getElementById('prompt-cont');
            promptCont.innerHTML = `
                <div class="prompt-keys-row">
                    <div class="prompt-key">SPACE</div>
                    <div class="prompt-key">SHIFT</div>
                    <div class="prompt-key">ENTER</div>
                </div>
                <div class="prompt-actions-row">
                    <div class="prompt-action">Exit</div>
                    <div class="prompt-action">Retry</div>
                    <div class="prompt-action">Next</div>
                </div>
            `;
        }
    </script>
