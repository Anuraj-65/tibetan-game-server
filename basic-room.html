    <style>
        @font-face { font-family: 'OuChan2'; src: url('Monlam Uni OuChan2.ttf'); }

        /* CRITICAL RESET */
        * { box-sizing: border-box; }

        :root { 
            --bg: #000000; 
            --accent: #d4af37; 
            --text: #ffffff; 
            --error: #ff4d4d; 
            --success: #00e676; 
            --blue-glow: #00ffff;
            --cursor-bg: rgba(0, 255, 255, 0.15);
            --cursor-border: rgba(0, 255, 255, 0.5);
        }
        
        body, html { 
            margin: 0; padding: 0;
            background: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', sans-serif; 
            height: 100vh; width: 100vw;
            overflow: hidden; 
            display: flex; flex-direction: column; 
            user-select: none;
        }

        /* --- MASSIVE FONTS & STAGE HEIGHTS --- */
        body.layout-large  { --dynamic-font-size: 90px; --stage-height: 40vh; }
        body.layout-medium { --dynamic-font-size: 110px; --stage-height: 55vh; }
        body.layout-small  { --dynamic-font-size: 130px; --stage-height: 70vh; }
        body.layout-clean  { --dynamic-font-size: 160px; --stage-height: 90vh; }

        /* --- PRELOADER --- */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 20000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.5s ease-out;
        }
        .loader-dots { display: flex; gap: 12px; }
        .dot { width: 15px; height: 15px; background-color: var(--accent); border-radius: 50%; box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { animation-delay: 0s; }
        .dot:nth-child(4) { animation-delay: 0.16s; }
        .dot:nth-child(5) { animation-delay: 0.32s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 20px var(--accent); } }

        /* --- HUD --- */
        .hud { 
            width: 100%; height: 80px; padding: 0 40px; 
            background: rgba(10, 10, 12, 0.95); 
            border-bottom: 1px solid rgba(212, 175, 55, 0.15); 
            flex-shrink: 0; z-index: 100;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        }
        .level-info { justify-self: start; }
        .level-info h1 { margin: 0; font-size: 14px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; font-weight: 700; }
        .controls-group { justify-self: center; display: flex; align-items: center; gap: 15px; }
        .phase-indicator { justify-self: end; font-size: 12px; letter-spacing: 3px; color: var(--success); text-transform: uppercase; font-weight: bold; white-space: nowrap; }

        /* --- BUTTONS --- */
        .icon-btn {
            background: none; border: none; color: #888;
            cursor: pointer; width: 44px; height: 44px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 8px; transition: all 0.2s ease;
        }
        .icon-btn:hover { color: #fff; } 
        
        /* Universal Active State */
        .icon-btn.active { color: #fff !important; background: transparent !important; }
        
        /* Hand Icon specific override to ensure no background */
        #btn-hand { color: #888; background: transparent !important; }
        #btn-hand.active { color: #fff !important; }
        
        .icon-btn.disabled { opacity: 0.3; cursor: not-allowed; }
        .icon-btn svg { width: 22px; height: 22px; fill: currentColor; } 

        /* --- DROPDOWN FIX --- */
        .dropdown { position: relative; height: 44px; display: flex; align-items: center; }
        .dropdown-menu {
            display: none; 
            position: absolute; 
            top: 100%; 
            left: 50%; 
            transform: translateX(-50%); /* Perfect Center */
            background: #1a1a1a; 
            border: 1px solid #333;
            border-radius: 8px; 
            padding: 5px; 
            min-width: 140px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            z-index: 200;
            margin-top: 10px; 
        }
        
        /* Invisible Bridge to prevent closing */
        .dropdown-menu::before {
            content: '';
            position: absolute; top: -15px; left: 0;
            width: 100%; height: 15px; background: transparent;
        }

        .dropdown:hover .dropdown-menu { display: block; }
        
        .dropdown-item {
            width: 100%; text-align: left; padding: 10px 15px; font-size: 12px; color: #aaa;
            background: none; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            transition: 0.2s; border-radius: 4px;
        }
        .dropdown-item:hover { background: #333; color: #fff; }
        .dropdown-item.selected { color: var(--accent); font-weight: bold; background: rgba(212, 175, 55, 0.1); }

        .size-controls { 
            display: flex; align-items: center; gap: 5px; 
            background: rgba(255,255,255,0.05); padding: 3px; 
            border-radius: 6px; border: 1px solid #333; height: 40px; 
        }
        .size-btn { 
            background: none; border: none; color: #888; 
            font-size: 14px; cursor: pointer; font-weight: bold; 
            width: 32px; height: 100%; display: flex; justify-content: center; align-items: center; 
            transition: 0.2s; border-radius: 4px;
        }
        .size-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        /* --- STAGE --- */
        .stage { 
            flex: 1; display: flex; flex-direction: column; width: 100%; 
            overflow: hidden; position: relative; 
            justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.8s ease-in; 
        }
        
        .target-container {
            width: 90%; max-width: 1200px;
            height: var(--stage-height); 
            display: block; 
            overflow-y: auto; overflow-x: hidden; 
            background: transparent;
            /* MASK REMOVED to prevent cutting off tall characters */
            scroll-behavior: smooth;
            text-align: center;
        }
        .target-container::-webkit-scrollbar { width: 0; background: transparent; }

        .target-text { 
            font-family: 'OuChan2', serif; 
            display: flex; flex-wrap: wrap; 
            justify-content: center; align-content: flex-start; 
            width: 100%; gap: 15px; row-gap: 20px; 
            line-height: 1.6; transition: all 0.3s ease;
            font-size: var(--dynamic-font-size);
            padding: 10vh 0; 
        }

        .char { 
            opacity: 0.3; transition: all 0.15s ease; position: relative; 
            display: inline-block; min-width: 0.6em; text-align: center;
            padding: 5px 8px; border-radius: 8px; 
            border: 1px solid transparent; vertical-align: middle;
        }
        
        .char.current { 
            opacity: 1; color: #fff; transform: scale(1.1); z-index: 10; 
            background: var(--cursor-bg);
            border-color: var(--cursor-border); 
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1);
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .char.correct { opacity: 0.8; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .char.wrong { opacity: 1; color: var(--error); animation: shake 0.3s; }
        .char.space-char { display: none; } 
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* --- KEYBOARD --- */
        #keyboard-wrapper { 
            width: 100%; max-width: 1000px; aspect-ratio: 950 / 400; 
            margin: 0 auto; flex-shrink: 0; position: relative; z-index: 20; 
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: visible !important;
        }
        
        body.layout-large #keyboard-wrapper  { height: 55vh; opacity: 1; margin-bottom: 10px;}
        body.layout-medium #keyboard-wrapper { height: 35vh; opacity: 1; margin-bottom: 20px;}
        body.layout-small #keyboard-wrapper  { height: 25vh; opacity: 1; margin-bottom: 30px;}
        body.layout-clean #keyboard-wrapper  { height: 0; opacity: 0; pointer-events: none; margin-bottom: 0;}
        body.hands-hidden #layer-hands-container { display: none; }

        #layer-keyboard {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: block; filter: drop-shadow(0 -20px 40px rgba(0,0,0,0.8)); z-index: 1;
        }

        #layer-hands-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
        }
        #layer-hands-container svg {
            width: 100%; height: 100%; display: block;
            preserveAspectRatio: xMidYMid meet;
        }

        #active-finger {
            fill: url(#finger-gradient) !important; stroke: none !important;
            filter: drop-shadow(0 0 15px var(--blue-glow)) !important; opacity: 1 !important;
        }
        #layer-hands-container svg g:not(#active-finger),
        #layer-hands-container svg path:not(#active-finger) { opacity: 0.5; }

        .st0 { fill: #d4af37; font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; pointer-events: none; }
        .st1 { fill: none; opacity: .5; stroke: #d4af37; stroke-width: 1.5px; transition: all 0.1s; }
        .st2 { fill: transparent; } 
        .key-guide { stroke: var(--blue-glow) !important; stroke-width: 3px !important; fill: rgba(0, 255, 255, 0.15) !important; opacity: 1 !important; filter: drop-shadow(0 0 15px var(--blue-glow)); }
        .key-hit { fill: var(--success) !important; stroke: var(--success) !important; filter: drop-shadow(0 0 15px var(--success)); transition: 0s; }

        /* --- MODAL --- */
        #result-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .result-box { background: rgba(0, 20, 10, 0.95); border: 2px solid var(--success); padding: 50px; text-align: center; box-shadow: 0 0 80px rgba(0,230,118,0.2); max-width: 400px; width: 90%; border-radius: 20px; }
        .res-title { color: var(--success); font-size: 24px; letter-spacing: 4px; margin-bottom: 30px; text-transform: uppercase; font-weight: 800; }
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
        .res-val { font-size: 48px; font-weight: bold; color: #fff; line-height: 1; }
        .res-label { font-size: 11px; color: #666; letter-spacing: 2px; margin-top: 5px; text-transform: uppercase; }
        .res-btn { background: var(--success); color: #000; border: none; padding: 15px 40px; font-weight: bold; letter-spacing: 2px; cursor: pointer; transition: 0.2s; text-transform: uppercase; margin-top: 10px; border-radius: 4px; font-size: 12px; }
        .res-btn:hover { background: #fff; transform: scale(1.05); }

        .back-btn { position: fixed; bottom: 20px; left: 30px; color: #444; text-decoration: none; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; z-index: 50; display: flex; align-items: center; gap: 8px; }
        .back-btn:hover { color: var(--accent); }

        @media (max-width: 768px) {
            .hud { padding: 0 15px; height: 60px; grid-template-columns: 1fr 1fr; row-gap: 5px; }
            .level-info { grid-column: 1 / 2; justify-self: start; }
            .phase-indicator { grid-column: 2 / 3; justify-self: end; font-size: 10px; }
            .controls-group { display: none; }
        }
    </style>
</head>

    <script>
        // --- CONSTANTS FOR STORAGE ---
        const PREF_LAYOUT = 'tk_pref_layout';
        const PREF_HANDS = 'tk_pref_hands';
        const PREF_SOUND = 'tk_pref_sound';
        const PREF_TEXT_SIZE = 'tk_pref_text_size';

        const sfx = {
            ctx: null, muted: false,
            init: function() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if(this.ctx.state === 'suspended') this.ctx.resume(); },
            toggle: function() { 
                this.muted = !this.muted; 
                
                // SAVE PREFERENCE
                localStorage.setItem(PREF_SOUND, this.muted);

                const btn = document.getElementById('sound-btn'); 
                if(this.muted) { 
                    btn.classList.add('muted'); 
                    // Muted Icon
                    btn.innerHTML = '<svg id="icon-vol-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
                } else { 
                    this.init(); 
                    btn.classList.remove('muted'); 
                    // Active Icon
                    btn.innerHTML = '<svg id="icon-vol-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
                } 
                btn.blur(); 
            },
            playClick: function() { if(this.muted || !this.ctx) return; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(800, this.ctx.currentTime); gain.gain.setValueAtTime(0.3, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08); osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.08); },
            playError: function() { if(this.muted || !this.ctx) return; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, this.ctx.currentTime); osc.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1); osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.1); }
        };

        const NORMAL_MAP = { 'k':'ཀ','t':'ཏ','p':'པ','s':'ས','d':'ད','f':'ང','g':'ག','h':'ཧ','j':'ཇ','l':'ལ','z':'ཟ','x':'ཙ','c':'ཅ','v':'ཌ','b':'བ','n':'ན','m':'མ','q':'ཊ','w':'ཝ','e':'ེ','r':'ར','y':'ཡ','u':'ུ','i':'ི','o':'ོ', '[':'༷',']':'྄','\\':'༔',';':'ཌྷ','\'':'འ',',':'‚','.':'ྲ','/':'།','`':'༌','1':'༡','2':'༢','3':'༣','4':'༤','5':'༥','6':'༦','7':'༧','8':'༨','9':'༩','0':'༠','-':'ྀ','=':'ཾ',' ':' ' };
        const SHIFT_MAP = { 'k':'ཁ','t':'ཐ','p':'ཕ','a':'ཨ','s':'ཤ','d':'ཛ','f':'དྷ','g':'གྷ','h':'ྷ','j':'ཛྷ','l':'ླ','z':'ཞ','x':'ཚ','c':'ཆ','v':'ཎ','b':'བྷ','n':'ཉ','m':'ཥ','q':'ཋ','w':'ྭ','e':'ཻ','r':'ཪ','y':'ྱ','u':'ཱུ','i':'ྀ','o':'ཽ', '[':'ྂ',']':'༵','\\':'྅',';':'ཿ','\'':'ཱ',',':'‚','.':'ླ','/':'„','`':'༸','1':'༑','2':'༄༅','3':'༅','4':'“','5':'”','6':'༈','7':'༼','8':'༽','9':'(','0':')','-':'ཱྀ','=':'ྃ',' ':' ' };
        const LEFT_HAND_KEYS = ['`','1','2','3','4','5','q','w','e','r','t','a','s','d','f','g','z','x','c','v','b'];

        const poseMap = {
            'ཀ': 'hands/k.svg',
            'ཁ': 'hands/sk.svg',
            'ག': 'hands/g.svg',
            'ང': 'hands/f.svg',
            'default': 'hands/rest.svg'
        };

        const svgCache = {};

        const basicLessons = [
            { type: "special", text: "START", footer: "POSITIONING" },
            { type: "tibetan", text: "ཀ ཁ ག ང", footer: "ALPHABET" },
            { type: "tibetan", text: "ཅ ཆ ཇ ཉ", footer: "ALPHABET" },
            { type: "special", text: "TEST I", footer: "MIXED 1 & 2" },
            { type: "special", text: "GAME I", footer: "REWARD" },
            { type: "tibetan", text: "ཏ ཐ ད ན", footer: "ALPHABET" },
            { type: "tibetan", text: "པ ཕ བ མ", footer: "ALPHABET" },
            { type: "special", text: "TEST II", footer: "MIXED 3 & 4" },
            { type: "special", text: "GAME II", footer: "REWARD" },
            { type: "tibetan", text: "ཙ ཚ ཛ ཝ", footer: "ALPHABET" },
            { type: "tibetan", text: "ཞ ཟ འ ཡ", footer: "ALPHABET" },
            { type: "special", text: "TEST III", footer: "MIXED 5 & 6" },
            { type: "special", text: "GAME III", footer: "REWARD" },
            { type: "tibetan", text: "ར ལ ཤ ས", footer: "ALPHABET" },
            { type: "tibetan", text: "ཧ ཨ ་ །", footer: "ALPHABET" },
            { type: "special", text: "TEST IV", footer: "MIXED 7 & 8" },
            { type: "special", text: "GAME IV", footer: "REWARD" },
            { type: "special", text: "FINAL", footer: "ALL 30 CHARS" },
            { type: "special", text: "GAME", footer: "BASIC COMPLETE" }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const levelIndex = parseInt(urlParams.get('level') || "1");
        const isTestMode = urlParams.get('mode') === 'test';

        let currentLesson = basicLessons[levelIndex];
        let baseChars = [];

        // UPDATED LOGIC: REMOVE SPACES from lesson text
        if (currentLesson.text === "TEST I") baseChars = "ཀཁགངཅཆཇཉ".split('');
        else if (currentLesson.text === "TEST II") baseChars = "ཏཐདནཔཕབམ".split('');
        else if (currentLesson.text === "TEST III") baseChars = "ཙཚཛཝཞཟའཡ".split('');
        else if (currentLesson.text === "TEST IV") baseChars = "རལཤསཧཨ།".split('');
        else if (currentLesson.text === "FINAL") baseChars = "ཀཁགངཅཆཇཉཏཐདནཔཕབམཙཚཛཝཞཟའཡརལཤསཧཨ".split('');
        else baseChars = currentLesson.text.replace(/ /g, '').split(''); // STRIP SPACES

        let targetString = "";
        let currentIndex = 0;
        let isPhase1 = !isTestMode; 
        let phase1RepCount = 0; 
        let drillStarted = isTestMode; 
        let startTime = isTestMode ? new Date() : null;
        let errors = 0;
        let charCount = 0;
        let currentFontSize = 140; 
        let currentLayout = 'layout-large';

        // Elements
        const stage = document.querySelector('.stage');
        const display = document.getElementById('target-display');
        const scrollContainer = document.getElementById('scroll-container');
        const phaseTxt = document.getElementById('phase-txt');
        const handContainer = document.getElementById('layer-hands-container');
        const preloader = document.getElementById('preloader');

        document.getElementById('level-title').innerText = isTestMode ? `Test: ${currentLesson.footer}` : `Level ${levelIndex}: ${currentLesson.footer}`;
        if(isTestMode) phaseTxt.innerText = "ASSESSMENT MODE";

        function preloadAssets() {
            const uniqueChars = [...new Set(baseChars)];
            const assetsToLoad = [];
            assetsToLoad.push(poseMap['default']);
            uniqueChars.forEach(char => { if (poseMap[char]) assetsToLoad.push(poseMap[char]); });

            let loaded = 0;
            if (assetsToLoad.length === 0) { hidePreloader(); return; }

            assetsToLoad.forEach(src => {
                fetch(src)
                .then(response => response.text())
                .then(text => {
                    let cleanText = text.replace(/<svg([^>]*)>/, '<svg$1 width="100%" height="100%" preserveAspectRatio="xMidYMid meet">');
                    svgCache[src] = cleanText; 
                    loaded++;
                    if (loaded === assetsToLoad.length) hidePreloader();
                })
                .catch(err => {
                    console.warn("Failed to load:", src);
                    loaded++;
                    if (loaded === assetsToLoad.length) hidePreloader();
                });
            });
        }

        function hidePreloader() {
            // Ensure font is ready before hiding
            document.fonts.ready.then(() => {
                setTimeout(() => {
                    preloader.style.opacity = '0';
                    setTimeout(() => {
                        preloader.style.display = 'none';
                        startActionPhase();
                        // Smooth Fade In
                        stage.style.opacity = '1';
                    }, 500);
                }, 200); 
            });
        }

        // --- LOAD PREFERENCES ON START ---
        window.addEventListener('load', () => {
            loadPreferences();
            prepareLevel();
            preloadAssets(); 
        });

        function loadPreferences() {
            // 1. Layout
            const savedLayout = localStorage.getItem(PREF_LAYOUT);
            if (savedLayout) {
                setLayout(savedLayout, false); // false = don't save again
            } else {
                setLayout('layout-large', false);
            }

            // 2. Hands (Default Visible)
            const handsHidden = localStorage.getItem(PREF_HANDS) === 'true';
            if (handsHidden) {
                toggleHands(false); // false = don't save, just apply
            }

            // 3. Sound (Default Unmuted)
            const isMuted = localStorage.getItem(PREF_SOUND) === 'true';
            if (isMuted) {
                // Manually apply mute state without toggling logic loop
                sfx.muted = true;
                const btn = document.getElementById('sound-btn');
                btn.classList.add('muted');
                btn.innerHTML = '<svg id="icon-vol-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
            }

            // 4. Text Size
            const savedSize = localStorage.getItem(PREF_TEXT_SIZE);
            if (savedSize) {
                currentFontSize = parseInt(savedSize);
                if(window.innerWidth > 768) display.style.fontSize = currentFontSize + "px";
            }
        }

        function toggleHands(save = true) {
            document.body.classList.toggle('hands-hidden');
            const btn = document.getElementById('btn-hand');
            const isHidden = document.body.classList.contains('hands-hidden');
            
            if (save) localStorage.setItem(PREF_HANDS, isHidden);

            if (isHidden) {
                btn.classList.remove('active');
                // HOLLOW HAND
                btn.innerHTML = '<svg id="icon-hand-off" viewBox="0 0 24 24"><path d="M23 5.5V20c0 2.2-1.8 4-4 4h-7.3c-1.08 0-2.1-.43-2.85-1.19L1 14.83s1.26-1.23 1.3-1.25c.22-.19.49-.29.79-.29.22 0 .42.06.6.16.04.01 4.31 2.46 4.31 2.46V4c0-.83.67-1.5 1.5-1.5S11 3.17 11 4v7h1V1.5c0-.83.67-1.5 1.5-1.5S15 .67 15 1.5V11h1V2.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5V11h1V5.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5z" style="fill:none;stroke:currentColor;stroke-width:2"/><line x1="2" y1="22" x2="22" y2="2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
            } else {
                btn.classList.add('active');
                // SOLID HAND
                btn.innerHTML = '<svg id="icon-hand-on" viewBox="0 0 24 24"><path d="M23 5.5V20c0 2.2-1.8 4-4 4h-7.3c-1.08 0-2.1-.43-2.85-1.19L1 14.83s1.26-1.23 1.3-1.25c.22-.19.49-.29.79-.29.22 0 .42.06.6.16.04.01 4.31 2.46 4.31 2.46V4c0-.83.67-1.5 1.5-1.5S11 3.17 11 4v7h1V1.5c0-.83.67-1.5 1.5-1.5S15 .67 15 1.5V11h1V2.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5V11h1V5.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5z"/></svg>';
            }
        }

        function setLayout(mode, save = true) {
            document.body.classList.remove('layout-large', 'layout-medium', 'layout-small', 'layout-clean');
            document.body.classList.add(mode);
            currentLayout = mode;

            document.querySelectorAll('.dropdown-item').forEach(item => item.classList.remove('selected'));
            const map = { 'layout-large': 0, 'layout-medium': 1, 'layout-small': 2, 'layout-clean': 3 };
            const idx = map[mode];
            if(idx !== undefined) {
                document.querySelectorAll('.dropdown-item')[idx].classList.add('selected');
            }
            
            // SMART SAVE: Only save if user manually clicked (save=true)
            if (save) {
                localStorage.setItem(PREF_LAYOUT, mode);
            }

            setTimeout(scrollToCursor, 100);
        }

        function prepareLevel() {
            if (!isTestMode) targetString = baseChars.join(''); 
            else targetString = generateDrillString(100);
        }

        function startActionPhase() {
            renderString();
            if(isTestMode && !startTime) startTime = new Date();
        }

        function renderString() {
            display.innerHTML = '';
            
            const chars = targetString.split('');
            chars.forEach((char, i) => {
                const span = document.createElement('span');
                span.innerText = char;
                span.className = 'char';
                if (i < currentIndex) span.classList.add('correct');
                if (i === currentIndex) span.classList.add('current');
                display.appendChild(span);
            });
            
            if(!isPhase1) ensureNoOrphan();
            updateGuide();
            setTimeout(scrollToCursor, 50);
        }
        
        function ensureNoOrphan() {
            setTimeout(() => {
                const spans = Array.from(document.querySelectorAll('.char'));
                if (spans.length < 5) return;
            }, 50);
        }

        function generateDrillString(length) {
            let newStr = "";
            for(let i=0; i<length; i++) {
                newStr += baseChars[Math.floor(Math.random() * baseChars.length)];
            }
            return newStr;
        }

        function startDrillPhase() {
            targetString = generateDrillString(60); 
            currentIndex = 0;
            isPhase1 = false;
            phaseTxt.innerText = "Phase 2: Speed Drill";
            
            // SMART PHASE 2 LOGIC:
            // Temporarily switch to Medium if on Large, but DO NOT SAVE IT (false)
            if (currentLayout === 'layout-large') {
                setLayout('layout-medium', false);
            }

            renderString();
            drillStarted = true;
            startTime = new Date();
        }

        function scrollToCursor() {
            const currentEl = document.querySelector('.char.current');
            if (currentEl) {
                currentEl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
            }
        }

        function updateGuide() {
            document.querySelectorAll('.key-guide').forEach(el => el.classList.remove('key-guide'));
            
            if (currentIndex >= targetString.length) return;

            const nextChar = targetString[currentIndex];
            const poseFile = poseMap[nextChar] || poseMap['default'];
            
            if (svgCache[poseFile]) {
                if (handContainer.getAttribute('data-current') !== poseFile) {
                    handContainer.innerHTML = svgCache[poseFile];
                    handContainer.setAttribute('data-current', poseFile);
                }
            } else {
                fetch(poseFile).then(r => r.text()).then(t => {
                     let cleanText = t.replace(/<svg([^>]*)>/, '<svg$1 width="100%" height="100%" preserveAspectRatio="xMidYMid meet">');
                     handContainer.innerHTML = cleanText;
                     handContainer.setAttribute('data-current', poseFile);
                });
            }

            let keyToHighlight = "";
            let useShift = false;

            for(let [k, v] of Object.entries(NORMAL_MAP)) { if(v === nextChar) { keyToHighlight = k; break; } }
            if(!keyToHighlight) {
                for(let [k, v] of Object.entries(SHIFT_MAP)) { if(v === nextChar) { keyToHighlight = k; useShift = true; break; } }
            }

            if (keyToHighlight) {
                highlightSVGKey(keyToHighlight, 'key-guide');
                if (useShift) {
                    if (LEFT_HAND_KEYS.includes(keyToHighlight)) highlightShiftKey('right', 'key-guide');
                    else highlightShiftKey('left', 'key-guide');
                }
            }
        }

        function highlightSVGKey(keyChar, className) {
            const texts = document.querySelectorAll('text.st0');
            const target = (keyChar === " ") ? "SPACEBAR" : keyChar.toUpperCase();
            texts.forEach(t => {
                const label = t.textContent.trim();
                if ((label === target) || (target === ";" && label === ";") || (target === "SPACEBAR" && label === "SPACEBAR")) {
                    const rect = t.parentElement.querySelector('rect.st1');
                    if (rect) rect.classList.add(className);
                }
            });
        }

        function highlightShiftKey(side, className) {
            const shifts = [];
            document.querySelectorAll('text.st0').forEach(t => { if (t.textContent.trim() === "SHIFT") shifts.push(t); });
            if (shifts.length >= 2) {
                const targetText = (side === 'left') ? shifts[0] : shifts[1];
                const rect = targetText.parentElement.querySelector('rect.st1');
                if (rect) rect.classList.add(className);
            }
        }

        function triggerHitEffect(key) {
            let k = key; if(key === " ") k = "SPACEBAR";
            highlightSVGKey(k, 'key-hit');
            setTimeout(() => { document.querySelectorAll('.key-hit').forEach(el => el.classList.remove('key-hit')); }, 100);
        }

        function adjustFontSize(delta) {
            currentFontSize = Math.max(10, Math.min(300, currentFontSize + delta));
            // Save Preference
            localStorage.setItem(PREF_TEXT_SIZE, currentFontSize);
            if (window.innerWidth > 768) display.style.fontSize = currentFontSize + "px";
        }

        window.addEventListener('keydown', (e) => {
            const modal = document.getElementById('result-modal');
            if (modal.style.display === 'flex') {
                if (e.key === 'Enter' || e.code === 'Space') {
                    window.location.href = 'lessons.html';
                }
                return;
            }

            sfx.init(); 

            if (e.key === "Tab" || e.key === "Alt") { e.preventDefault(); return; }
            if (e.key === "Shift") return;

            triggerHitEffect(e.key);

            const spans = document.querySelectorAll('.char');
            if (currentIndex >= spans.length) return;

            const physicalKey = e.key.toLowerCase();
            let typedChar = (e.shiftKey ? SHIFT_MAP[physicalKey] : NORMAL_MAP[physicalKey]) || "";
            
            if (e.code === "Space") typedChar = " ";

            const targetChar = targetString[currentIndex];
            let isMatch = (typedChar === targetChar);
            
            if (targetChar === " " && e.code === "Space") isMatch = true;

            if (isMatch) {
                sfx.playClick(); 
                spans[currentIndex].className = 'char correct';
                
                currentIndex++;
                charCount++;
                
                if (currentIndex < spans.length) {
                    spans[currentIndex].className = 'char current';
                    updateGuide();
                    scrollToCursor();
                } else {
                    if (isPhase1) {
                         if (phase1RepCount === 0) {
                            phase1RepCount++;
                            currentIndex = 0; 
                            targetString = baseChars.join('') + baseChars.join(''); 
                            renderString(); 
                        } else {
                            setTimeout(startDrillPhase, 200);
                        }
                    } else {
                        finishLevel();
                    }
                }
            } else {
                errors++;
                sfx.playError();
                spans[currentIndex].classList.add('wrong');
                setTimeout(() => spans[currentIndex].classList.remove('wrong'), 200);
            }
        });

        function finishLevel() {
            localStorage.setItem('tk_lvl_' + levelIndex, 'true');
            const timeMins = (new Date() - startTime) / 60000;
            const wpm = Math.round((charCount / 5) / timeMins) || 0;
            const acc = Math.round(((charCount - errors) / charCount) * 100) || 100;
            const stats = { wpm: wpm, acc: acc };
            localStorage.setItem('tk_stats_' + levelIndex, JSON.stringify(stats));
            document.getElementById('res-wpm').innerText = wpm;
            document.getElementById('res-acc').innerText = acc + "%";
            document.getElementById('result-modal').style.display = 'flex';
        }
    </script>
</body>
</html>
