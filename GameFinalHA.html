<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TibetanKeys: Horse Arrow (FINAL)</title>
    <link rel="icon" type="image/png" href="og.png">
    <style>
        /* 1. FONT LOADING */
        @font-face {
            font-family: 'OuChan2';
            src: url('Monlam Uni OuChan2.ttf') format('truetype');
        }
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700;900&display=swap');

        /* 2. GLOBAL SETTINGS */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000510; /* Deepest Space Blue */
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif; user-select: none;
        }

        /* 3. HUD LAYOUT */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 20; padding: 30px; box-sizing: border-box;
        }
        .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .score-val { 
            font-family: 'Roboto Mono', monospace; font-size: 60px; color: #fff; 
            line-height: 1; text-shadow: 0 0 20px #d4af37; margin-bottom: 5px; 
        }
        .score-lbl { 
            font-size: 14px; color: #d4af37; letter-spacing: 3px; font-weight: bold; 
        }
        .lives { font-size: 40px; filter: drop-shadow(0 0 5px #ff0055); }

        /* Power Up Bar */
        .power-bar {
            position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
            width: 400px; opacity: 0; transition: opacity 0.3s; text-align: center;
        }
        .power-bar.active { opacity: 1; }
        .p-name { 
            color: #fff; font-family: 'Roboto Mono'; font-size: 24px; 
            text-shadow: 0 0 10px #fff; margin-bottom: 5px; 
        }
        .p-track { 
            width: 100%; height: 8px; background: rgba(255,255,255,0.2); 
            border: 1px solid #d4af37; border-radius: 4px; overflow: hidden; 
        }
        .p-fill { 
            height: 100%; width: 100%; background: #fff; 
            box-shadow: 0 0 15px #fff; transition: width 0.1s linear; 
        }

        /* Slow Motion FX */
        #slow-fx {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(212, 175, 55, 0.15); pointer-events: none; opacity: 0; 
            transition: opacity 0.5s; z-index: 10; mix-blend-mode: overlay;
        }

        /* Start / End Screens */
        #screens {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 100;
            display: flex; justify-content: center; align-items: center;
            display: none;
        }
        
        .box {
            text-align: center; border: 4px solid #d4af37; padding: 60px 100px;
            background: linear-gradient(145deg, #1a1500, #000);
            box-shadow: 0 0 80px rgba(212, 175, 55, 0.3); border-radius: 12px;
        }
        h1 { color: #fff; font-family: 'Roboto Mono'; font-size: 50px; margin: 0 0 15px 0; text-shadow: 0 0 20px #d4af37; }
        p { color: #ffe082; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; }
        
        #end-box {
            background: #ffffff;
            transform: rotate(0deg);
            padding: 50px 60px;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 4px solid #d4af37;
            text-align: center;
            min-width: 400px;
        }
        #end-box h1 { 
            color: #000; font-family: 'Roboto Mono', monospace; font-size: 20px; 
            letter-spacing: 4px; margin: 0 0 10px 0; text-transform: uppercase; font-weight: 900;
        }
        #end-box #final-score {
            color: #d4af37; font-family: 'Roboto Mono', monospace; font-size: 100px; 
            margin: 0 0 40px 0; line-height: 1; font-weight: 900;
            text-shadow: 2px 2px 0px #000;
        }

        .btn-black {
            display: block; width: 100%; background: #000; color: #d4af37; border: 1px solid #d4af37;
            padding: 20px 0; font-size: 18px; font-weight: bold; font-family: 'Roboto Mono';
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px;
            transition: transform 0.1s;
        }
        .btn-black:hover { transform: scale(1.02); background: #111; }
        .btn-white {
            display: block; width: 100%; background: #fff; color: #666; border: 2px solid #ddd;
            padding: 18px 0; font-size: 16px; font-weight: bold; font-family: 'Roboto Mono';
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.2s;
        }
        .btn-white:hover { border-color: #333; color: #000; }

        .neon-btn {
            background: #d4af37; color: #000; border: none; padding: 20px 60px;
            font-size: 20px; font-weight: 900; letter-spacing: 2px; cursor: pointer;
            font-family: 'Roboto Mono'; transition: 0.2s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }
        .neon-btn:hover { background: #fff; transform: scale(1.05); box-shadow: 0 0 50px #d4af37; }

        #click-start {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 200;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .blink { animation: blink 1.5s infinite; color: #d4af37; font-family: 'Roboto Mono'; font-size: 24px; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }

        canvas { display: block; }
    </style>
</head>
<body>

    <div id="slow-fx"></div>

    <div id="ui-layer">
        <div class="top-row">
            <div>
                <div class="score-val" id="score">0</div>
                <div class="score-lbl">METERS</div>
            </div>
            <div class="lives" id="lives">❤️❤️❤️</div>
        </div>
        <div class="power-bar" id="power-ui">
            <div class="p-name" id="p-name">SPEED</div>
            <div class="p-track"><div class="p-fill" id="p-fill"></div></div>
        </div>
    </div>

    <div id="click-start" onclick="Game.start()">
        <div class="blink">[ CLICK TO START ]</div>
    </div>

    <div id="screens">
        <div class="box" id="start-box" style="display:none;">
            <h1>THE ASCENT</h1>
            <p>Master the 30 Warriors</p>
            <button class="neon-btn" onclick="Game.start()">BEGIN</button>
        </div>
        
        <div id="end-box" style="display:none;">
            <h1>LEGEND ENDED</h1>
            <div id="final-score">0m</div>
            <button class="btn-black" onclick="location.reload()">RISE AGAIN</button>
            <button class="btn-white" onclick="window.location.href='lessons.html'">RETURN TO MAP</button>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

<script>
/**
 * ==========================================================
 * THE YAK LEGEND: FINAL ASCENT (FULL ROSTER)
 * ==========================================================
 */

// --- 1. CONFIGURATION ---
// THE FULL 30 ROOT LETTERS (ཀ TO ཨ)
const KEY_MAP = {
    // Row 1
    'k': 'ཀ', 'K': 'ཁ', 'g': 'ག', 'f': 'ང',
    // Row 2
    'c': 'ཅ', 'C': 'ཆ', 'j': 'ཇ', 'N': 'ཉ',
    // Row 3
    't': 'ཏ', 'T': 'ཐ', 'd': 'ད', 'n': 'ན',
    // Row 4
    'p': 'པ', 'P': 'ཕ', 'b': 'བ', 'm': 'མ',
    // Row 5
    'x': 'ཙ', 'X': 'ཚ', 'D': 'ཛ', 'w': 'ཝ',
    // Row 6
    'z': 'ཞ', 'Z': 'ཟ', '\'': 'འ', 'y': 'ཡ',
    // Row 7
    'r': 'ར', 'l': 'ལ', 'S': 'ཤ', 's': 'ས',
    // Row 8
    'h': 'ཧ', 'A': 'ཨ'
};

const CHAR_POOL = Object.keys(KEY_MAP);
const POWERS = { NONE: 0, LEVITATE: 1, DOUBLE: 2, SPEED: 3, LIFE: 4, SLOW: 5 };

const C = {
    GRAVITY: 0.5,
    ARROW_SPEED: 70, 
    PLAYER_X: 180,
    GROUND_H: 140, 
    POWER_TIME: 600
};

// --- 2. AUDIO (SFX Only) ---
const Sfx = {
    ctx: null,
    
    init: function() { 
        if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); 
    },
    
    play: function(type, f1, f2, dur, vol) {
        if(!this.ctx) return;
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f1, this.ctx.currentTime);
        if(f2) o.frequency.exponentialRampToValueAtTime(f2, this.ctx.currentTime+dur);
        g.gain.setValueAtTime(vol, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime+dur);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime+dur);
    },
    
    shoot: () => Sfx.play('triangle', 800, 200, 0.1, 0.15),
    hit: () => Sfx.play('square', 400, 100, 0.1, 0.25), // Stronger hit sound
    power: () => Sfx.play('sine', 600, 1200, 0.6, 0.2),
    damage: () => Sfx.play('sawtooth', 150, 20, 0.4, 0.4),
};

// --- 3. GAME ENGINE ---
const Game = {
    canvas: null, ctx: null, width: 0, height: 0,
    active: false, frame: 0,
    
    // Stats
    lives: 3, score: 0, speed: 6, // Starts moderate, ramps up fast
    
    // Powerups
    powerType: 0, powerTimer: 0, timeScale: 1.0,
    
    // Entities
    player: { y: 0, targetY: 0, bowDraw: 0 },
    arrows: [], obs: [], sky: [], particles: [], mountains: [],
    
    // Logic
    flyTimer: 0, lastObsX: 0, shake: 0,

    init: function() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        window.addEventListener('keypress', (e) => this.input(e));
        
        // Init Background (The Summit)
        // Layer 1: Distant Gold Peaks
        let pts1 = [];
        for(let x=0; x < 4000; x+=100) pts1.push({x: x, y: 150 + Math.random()*200});
        this.mountains.push({pts: pts1, color: '#2a2000'}); // Dark Gold

        // Layer 2: Mid-range
        let pts2 = [];
        for(let x=0; x < 4000; x+=100) pts2.push({x: x, y: 100 + Math.random()*200});
        this.mountains.push({pts: pts2, color: '#4d3b00'}); 

        // Layer 3: Close
        let pts3 = [];
        for(let x=0; x < 4000; x+=100) pts3.push({x: x, y: 50 + Math.random()*250});
        this.mountains.push({pts: pts3, color: '#7a5e00'}); 

        // Layer 4: Foreground
        let pts4 = [];
        for(let x=0; x < 4000; x+=100) pts4.push({x: x, y: 20 + Math.random()*150});
        this.mountains.push({pts: pts4, color: '#a88200'}); // Bright Gold
        
        Sfx.init();
        requestAnimationFrame(() => this.loop());
    },

    resize: function() {
        this.width = window.innerWidth; this.height = window.innerHeight;
        this.canvas.width = this.width; this.canvas.height = this.height;
    },

    start: function() {
        Sfx.init();
        document.getElementById('click-start').style.display = 'none';
        this.active = true;
    },

    // --- MAIN LOOP ---
    loop: function() {
        requestAnimationFrame(() => this.loop());
        if(!this.active) return;

        this.frame++;
        this.update();
        this.draw();
    },

    update: function() {
        // RAMP UP DIFFICULTY
        if(this.frame % 600 === 0 && this.speed < 22) this.speed += 0.5;

        let modSpeed = this.speed;
        this.timeScale = 1.0;

        if (this.powerType === POWERS.SPEED) {
            modSpeed = 28; this.score += 6; // Legendary speed
        } else if (this.powerType === POWERS.SLOW) {
            this.timeScale = 0.4; modSpeed *= 0.4;
            document.getElementById('slow-fx').style.opacity = 1;
        } else {
            document.getElementById('slow-fx').style.opacity = 0;
            this.score += modSpeed / 20;
        }
        document.getElementById('score').innerText = Math.floor(this.score);

        // Timer Logic
        if (this.powerTimer > 0) {
            this.powerTimer--;
            let pct = (this.powerTimer / C.POWER_TIME) * 100;
            document.getElementById('p-fill').style.width = pct + "%";
            
            // Safe Landing Check
            if (this.powerTimer < 20 && (this.powerType === POWERS.LEVITATE || this.powerType === POWERS.SPEED)) {
                 this.clearLanding();
            }

            if (this.powerTimer <= 0) {
                this.powerType = 0;
                document.getElementById('power-ui').classList.remove('active');
                this.player.targetY = 0;
            }
        }

        // Physics
        if (this.powerType === POWERS.LEVITATE || this.powerType === POWERS.SPEED) {
             this.player.targetY = -220; 
        } else {
             this.player.targetY = 0;
        }
        
        this.player.y += (this.player.targetY - this.player.y) * 0.05;
        if(this.player.bowDraw > 0) this.player.bowDraw *= 0.8;

        // --- SPAWNING ---
        let gap = this.width - this.lastObsX;
        let spawnRate = (this.powerType === POWERS.SPEED) ? 0.6 : 0.04; 
        
        let isLanding = (this.powerTimer > 0 && this.powerTimer < 60 && (this.powerType === POWERS.LEVITATE || this.powerType === POWERS.SPEED));
        
        if (gap > 300 && Math.random() < spawnRate && !isLanding) this.spawnObs();

        if (this.flyTimer > 0) this.flyTimer--;
        else if (Math.random() < 0.02) { 
            this.spawnFly();
            if (Math.random() < 0.4) setTimeout(() => this.spawnFly(), 400); 
            this.flyTimer = 300 + Math.random() * 400; 
        }

        this.updateEntities(modSpeed);
    },

    updateEntities: function(speed) {
        this.mountains.forEach((m, idx) => {
            m.pts.forEach(p => { p.x -= (speed * 0.1 * (idx+1)) * this.timeScale; });
            if(m.pts[0].x < -150) {
                let p = m.pts.shift(); p.x = m.pts[m.pts.length-1].x + 100; p.y = 20 + Math.random()*250; m.pts.push(p);
            }
        });

        for(let i=this.arrows.length-1; i>=0; i--) {
            let a = this.arrows[i];
            a.vy += C.GRAVITY * this.timeScale; a.x += a.vx * this.timeScale; a.y += a.vy * this.timeScale;

            if(a.target) {
                let tx = a.target.x + 30; 
                let ty = a.target.type==='FLY' ? a.target.y : (this.height - 150);
                
                if(Math.hypot(a.x - tx, a.y - ty) < 60) {
                    if(a.target.type==='FLY') {
                        this.activatePower(a.target.pId);
                        let idx = this.sky.indexOf(a.target);
                        if(idx > -1) this.sky.splice(idx, 1);
                    } else {
                        a.target.dead = true; 
                        Sfx.hit();
                    }
                    this.spawnBoom(tx, ty, '#d4af37');
                    this.arrows.splice(i, 1);
                    continue;
                }
            }
            if(a.y > this.height || a.x > this.width) this.arrows.splice(i, 1);
        }

        for(let i=this.obs.length-1; i>=0; i--) {
            let o = this.obs[i];
            if(o.dead) { this.obs.splice(i,1); continue; }
            o.x -= speed;

            let safe = (this.powerType === POWERS.LEVITATE || this.powerType === POWERS.SPEED);
            if (!safe) {
                if(o.x < C.PLAYER_X + 80 && o.x > C.PLAYER_X - 20) {
                    if(this.player.y > -50) { this.takeDamage(); o.dead = true; }
                }
            }
            if(o.x < -100) this.obs.splice(i,1);
        }
        if(this.obs.length > 0) this.lastObsX = Math.max(...this.obs.map(o=>o.x)); else this.lastObsX = 0;

        for(let i=this.sky.length-1; i>=0; i--) {
            this.sky[i].x -= speed * 1.2;
            if(this.sky[i].x < -100) this.sky.splice(i,1);
        }

        for(let i=this.particles.length-1; i>=0; i--) {
            let p = this.particles[i];
            p.x += p.vx * this.timeScale; p.y += p.vy * this.timeScale; p.life-=0.05;
            if(p.life <= 0) this.particles.splice(i,1);
        }
    },

    // --- DRAWING ---
    draw: function() {
        let sx = (Math.random()-0.5) * this.shake;
        let sy = (Math.random()-0.5) * this.shake;
        if(this.shake > 0) this.shake *= 0.9;

        this.ctx.clearRect(0,0,this.width, this.height);
        let grad = this.ctx.createLinearGradient(0,0,0,this.height);
        // Level Final Atmosphere: Deep Space Blue/Black
        grad.addColorStop(0, '#000510'); grad.addColorStop(1, '#000');
        this.ctx.fillStyle = grad; this.ctx.fillRect(0,0,this.width,this.height);

        this.ctx.save();
        this.ctx.translate(sx, sy);

        this.mountains.forEach((m, idx) => {
            this.ctx.fillStyle = m.color; // Gold gradients
            this.ctx.beginPath(); this.ctx.moveTo(0, this.height);
            m.pts.forEach(p => this.ctx.lineTo(p.x, this.height - p.y));
            this.ctx.lineTo(this.width, this.height); this.ctx.fill();
        });

        this.ctx.fillStyle = '#0a0800'; 
        this.ctx.fillRect(0, this.height - C.GROUND_H, this.width, C.GROUND_H);
        this.ctx.strokeStyle = '#d4af37'; this.ctx.lineWidth = 3;
        this.ctx.shadowBlur = 15; this.ctx.shadowColor = '#d4af37';
        this.ctx.beginPath(); 
        this.ctx.moveTo(0, this.height - C.GROUND_H); 
        this.ctx.lineTo(this.width, this.height - C.GROUND_H); 
        this.ctx.stroke();
        this.ctx.shadowBlur = 0;

        // --- CLIPPING MASK ---
        this.ctx.save();
        this.ctx.beginPath();
        this.ctx.rect(0, 0, this.width, this.height);
        this.ctx.rect(200, 0, -200, 120); 
        this.ctx.clip("evenodd"); 

        this.drawHorseAndRider(); 
        this.ctx.restore(); 
        // -------------------------

        this.ctx.fillStyle = '#fff';
        this.arrows.forEach(a => {
            this.ctx.save();
            this.ctx.translate(a.x, a.y);
            this.ctx.rotate(Math.atan2(a.vy, a.vx));
            this.ctx.fillRect(0, -2, 40, 4);
            this.ctx.restore();
        });

        this.obs.forEach(o => {
            let y = this.height - 150;
            this.ctx.shadowBlur = 20; this.ctx.shadowColor = '#d4af37';
            this.ctx.strokeStyle = '#d4af37'; this.ctx.lineWidth = 4;
            
            // Gold Circles for Final
            this.ctx.beginPath(); this.ctx.arc(o.x+30, y, 60, 0, Math.PI*2); this.ctx.stroke();
            this.ctx.shadowBlur = 0;
            
            this.ctx.fillStyle = '#fff'; this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle';
            this.ctx.font = 'bold 70px "OuChan2"'; 
            
            this.ctx.strokeStyle = '#000';
            this.ctx.lineWidth = 3;
            this.ctx.strokeText(KEY_MAP[o.key] || o.key, o.x+30, y-5);
            this.ctx.fillText(KEY_MAP[o.key] || o.key, o.x+30, y-5);
        });

        this.sky.forEach(b => {
            let y = b.y + Math.sin(this.frame * 0.1) * 15;
            this.ctx.save(); this.ctx.translate(b.x, y);
            
            // Glowing Orbs for Powerups
            this.ctx.shadowBlur=30; this.ctx.shadowColor=b.color;
            this.ctx.fillStyle = b.color;
            this.ctx.beginPath(); this.ctx.arc(0, 0, 30, 0, Math.PI*2); this.ctx.fill();
            
            this.ctx.shadowBlur=0; this.ctx.fillStyle='#000';
            this.ctx.font = 'bold 45px "OuChan2"';
            
            this.ctx.fillText(KEY_MAP[b.key] || b.key, 0, 10);
            
            this.ctx.fillStyle='#fff';
            this.ctx.font = '16px "Roboto Mono"';
            let names = ["", "FLOAT", "DOUBLE", "SPEED", "LIFE", "SLOW"];
            this.ctx.fillText(names[b.pId], 0, -45);
            this.ctx.restore();
        });

        this.ctx.fillStyle = '#d4af37';
        this.particles.forEach(p => {
            this.ctx.globalAlpha = p.life;
            this.ctx.fillRect(p.x, p.y, 4, 4);
        });
        this.ctx.globalAlpha = 1;
        this.ctx.restore();
    },

    // --- VISUAL: HORSE ARCHER (GOLD EDITION) ---
    drawHorseAndRider: function() {
        const x = C.PLAYER_X;
        const y = this.height - C.GROUND_H + this.player.y;
        this.ctx.save(); this.ctx.translate(x, y); this.ctx.scale(0.8, 0.8);

        let t = this.frame * 0.4 * this.timeScale;
        
        let legFront = Math.sin(t);
        let legBack = Math.sin(t - Math.PI/2);
        let bodyBob = Math.abs(Math.sin(t*2)) * 5;

        if (this.powerType === POWERS.LEVITATE || this.powerType === POWERS.SPEED) { bodyBob=0; }

        this.ctx.translate(0, -bodyBob);
        this.ctx.strokeStyle = '#fff'; this.ctx.lineWidth = 5; 
        this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round';
        this.ctx.shadowBlur = 15; this.ctx.shadowColor = '#d4af37'; // Golden Aura

        // 1. HORSE
        this.drawHorseLeg(-30, 10, legBack);
        this.drawHorseLeg(-45, 10, legBack + 0.5);

        this.ctx.beginPath();
        this.ctx.moveTo(-50, -10);
        this.ctx.lineTo(40, -10); 
        this.ctx.lineTo(30, 20); 
        this.ctx.lineTo(-40, 20);
        this.ctx.closePath();
        this.ctx.stroke();

        this.drawHorseLeg(30, 10, legFront);
        this.drawHorseLeg(45, 10, legFront + 0.5);

        this.ctx.beginPath();
        this.ctx.moveTo(40, -10);
        this.ctx.lineTo(60, -40);
        this.ctx.lineTo(75, -30);
        this.ctx.lineTo(70, -15);
        this.ctx.lineTo(50, -10);
        this.ctx.stroke();

        this.ctx.beginPath();
        this.ctx.moveTo(-50, -10);
        this.ctx.quadraticCurveTo(-70 - (Math.sin(t)*10), -5, -60, 10);
        this.ctx.stroke();

        // 2. RIDER
        this.ctx.save();
        this.ctx.translate(10, -25);
        this.ctx.beginPath(); this.ctx.moveTo(0,0); this.ctx.lineTo(0, -30); this.ctx.stroke();
        this.ctx.beginPath(); this.ctx.arc(0, -40, 10, 0, Math.PI*2); this.ctx.stroke();
        
        this.ctx.save(); this.ctx.translate(0, -25);
        let aimX = 40; let aimY = 5;
        this.ctx.beginPath(); this.ctx.moveTo(0,0); this.ctx.lineTo(aimX, aimY); this.ctx.stroke();
        
        this.ctx.translate(aimX, aimY);
        this.ctx.strokeStyle = '#d4af37'; // Golden Bow
        this.ctx.beginPath(); this.ctx.arc(0, 0, 25, -1.5, 1.5, false); this.ctx.stroke();
        
        this.ctx.strokeStyle = '#fff'; this.ctx.lineWidth=1;
        let pull = this.player.bowDraw * 15;
        this.ctx.beginPath(); this.ctx.moveTo(2, -25); this.ctx.lineTo(-pull, 0); this.ctx.lineTo(2, 25); this.ctx.stroke();
        
        this.ctx.restore(); this.ctx.restore();
        this.ctx.restore();
    },

    drawHorseLeg: function(x, y, cycle) {
        let thigh = Math.sin(cycle) * 0.8; 
        let knee = cycle < 0 ? Math.abs(cycle)*1.2 : 0;
        this.ctx.save(); this.ctx.translate(x, y); this.ctx.rotate(thigh);
        this.ctx.beginPath(); this.ctx.moveTo(0,0); this.ctx.lineTo(0, 25); this.ctx.stroke();
        this.ctx.translate(0, 25); this.ctx.rotate(knee);
        this.ctx.beginPath(); this.ctx.moveTo(0,0); this.ctx.lineTo(0, 25); this.ctx.stroke();
        this.ctx.restore();
    },

    spawnObs: function() {
        let key = CHAR_POOL[Math.floor(Math.random()*CHAR_POOL.length)];
        this.obs.push({ x: this.width, key: key, dead: false, isTargeted: false });
        this.lastObsX = this.width;
    },

    spawnFly: function() {
        let ground = this.obs.map(o=>o.key);
        let safe = CHAR_POOL.filter(k => !ground.includes(k));
        if(safe.length === 0) return;
        let key = safe[Math.floor(Math.random()*safe.length)];
        let p = [1, 2, 3, 4, 5][Math.floor(Math.random()*5)];
        let color = p===3?'#00ffff':(p===4?'#ff00ff':'#ffd700');
        this.sky.push({ x: this.width, y: 150+Math.random()*150, key: key, pId: p, color: color, type: 'FLY' });
    },

    clearLanding: function() {
        this.obs.forEach(o => { 
            if (o.x > 100 && o.x < 300 && !o.dead) {
                o.dead = true; 
                this.spawnBoom(o.x, this.height-150, '#d4af37'); 
            }
        });
    },

    fire: function(target) {
        Sfx.shoot();
        this.player.bowDraw = 1.0;
        let startX = C.PLAYER_X + 60; let startY = this.height - C.GROUND_H + this.player.y - 50;
        let tx = target.x + 30; let ty = target.type === 'FLY' ? target.y : (this.height - 150);
        let dx = tx - startX; let t = dx / C.ARROW_SPEED;
        let vy = (ty - startY)/t - (0.5 * C.GRAVITY * t);
        this.arrows.push({ x: startX, y: startY, vx: C.ARROW_SPEED, vy: vy, target: target });
    },

    activatePower: function(p) {
        Sfx.power();
        this.powerType = p; this.powerTimer = C.POWER_TIME;
        let names = ["", "LEVITATION", "DOUBLE ARROW", "SPEED", "LIFE", "SLOW"];
        if(p===4) { 
            this.lives++; 
            this.powerType=0; 
        } else {
            document.getElementById('p-name').innerText = names[p];
            document.getElementById('power-ui').classList.add('active');
        }
        this.updateLives();
    },

    spawnBoom: function(x, y, c) {
        for(let i=0; i<10; i++) this.particles.push({x,y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:1,c});
    },

    takeDamage: function() {
        Sfx.damage();
        this.lives--; this.shake = 20; this.updateLives();
        if(this.lives <= 0) {
            this.active = false;
            document.getElementById('final-score').innerText = Math.floor(this.score) + "m"; 
            document.getElementById('screens').style.display = 'flex';
            document.getElementById('end-box').style.display = 'block';
        }
    },

    updateLives: function() { document.getElementById('lives').innerHTML = "❤️".repeat(this.lives); },

    input: function(e) {
        if(!this.active) return;
        let k = e.key; 
        
        let fly = this.sky.find(b => b.key === k || KEY_MAP[k] === b.key);
        if(fly) { this.fire(fly); return; }

        let targets = this.obs.filter(o => !o.dead && !o.isTargeted && (o.key === k || KEY_MAP[k] === o.key)).sort((a,b)=>a.x-b.x);
        
        if(targets.length > 0) {
            let t = targets[0];
            this.fire(t); 
            t.isTargeted = true; 
            
            if(this.powerType === 2) { 
                let t2 = this.obs.find(o => !o.dead && !o.isTargeted && o !== t);
                if(t2) { this.fire(t2); t2.isTargeted = true; }
            }
        }
    }
};

Game.init();
</script>
</body>
</html>
